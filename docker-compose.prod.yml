# docker-compose.prod.yml — Production overrides for existing server deployment
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  web:
    build:
      context: .
      args:
        INSTALL_DEV: "false"
    command: uwsgi --ini config/uwsgi.ini
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    volumes:
      - static_files:/app/staticfiles
    # No host ports — internal nginx container handles routing

  db:
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"

  celery:
    build:
      context: .
      args:
        INSTALL_DEV: "false"
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod

  celery-beat:
    build:
      context: .
      args:
        INSTALL_DEV: "false"
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod

  nginx:
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=https://grafana.tsaklidis.gr/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  static_files:
  grafana_data:

