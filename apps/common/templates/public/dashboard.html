<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sensor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',sans-serif;background:#0c1222;color:#e2e8f0;min-height:100vh;padding-bottom:2rem}

        .title-bar{background:#111a2e;border:1px solid #1c2d4a;border-radius:8px;max-width:500px;margin:1.5rem auto;padding:1rem 2rem;text-align:center}
        .title-bar h1{font-size:1.1rem;font-weight:700;color:#e2e8f0;line-height:1.4}

        .hero{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;max-width:650px;margin:1.5rem auto;padding:0 1rem}
        .hero-card{background:#111a2e;border:1px solid #1c2d4a;border-radius:14px;padding:1.4rem 1.6rem;position:relative;overflow:hidden;transition:transform .15s}
        .hero-card:hover{transform:translateY(-2px)}
        .hero-card .accent{position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0}
        .hero-card.temp .accent{background:linear-gradient(90deg,#ef4444,#f97316)}
        .hero-card.prs .accent{background:linear-gradient(90deg,#3b82f6,#38bdf8)}
        .hero-card .hero-top{display:flex;align-items:center;gap:0.7rem;margin-bottom:0.8rem}
        .hero-card .hero-icon{font-size:1.6rem;width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .hero-card.temp .hero-icon{background:rgba(239,68,68,.15)}
        .hero-card.prs .hero-icon{background:rgba(56,189,248,.15)}
        .hero-card .hero-label{font-size:0.7rem;color:#94a3b8;letter-spacing:0.03em}
        .hero-card .hero-sensor{font-size:0.6rem;color:#64748b;margin-top:1px}
        .hero-card .hero-val{font-size:2.4rem;font-weight:700;line-height:1}
        .hero-card.temp .hero-val{color:#ef4444}
        .hero-card.prs .hero-val{color:#38bdf8}
        .hero-card .hero-unit{font-size:1rem;font-weight:400;color:#64748b;margin-left:0.15rem}
        .hero-card .hero-range{display:flex;gap:1rem;margin-top:0.7rem;font-size:0.7rem;color:#64748b}
        .hero-card .hero-range span{display:flex;align-items:center;gap:0.25rem}
        .hero-card .hero-range .lo{color:#38bdf8}
        .hero-card .hero-range .hi{color:#ef4444}
        .hero-card .hero-time{font-size:0.6rem;color:#475569;margin-top:0.5rem}

        .charts-info{max-width:650px;margin:2rem auto 1.5rem;background:#152035;border:1px solid #1c2d4a;border-radius:6px;padding:0.7rem 1rem;font-size:0.8rem;color:#94a3b8;text-align:center}

        .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;max-width:950px;margin:0 auto 2rem;padding:0 1rem}
        .chart-card{background:#111a2e;border:1px solid #1c2d4a;border-radius:8px;padding:1rem}
        .chart-card .ch-legend{display:flex;align-items:center;gap:0.4rem;justify-content:center;margin-bottom:0.5rem;font-size:0.75rem;color:#94a3b8}
        .chart-card .ch-legend .swatch{width:14px;height:10px;border-radius:2px;display:inline-block}
        .chart-card canvas{width:100%!important;height:200px!important}

        .info-section{max-width:650px;margin:2.5rem auto;background:#111a2e;border:1px solid #1c2d4a;border-radius:14px;overflow:hidden;position:relative}
        .info-section .accent{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#38bdf8,#3b82f6);border-radius:14px 14px 0 0}
        .info-header{padding:1.2rem 1.5rem 0.6rem;font-size:0.8rem;font-weight:600;color:#e2e8f0;display:flex;align-items:center;gap:0.5rem}
        .info-header .info-icon{font-size:1.1rem}
        .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:0 0.5rem 0.8rem}
        .info-item{padding:0.6rem 1rem;border-radius:8px;transition:background .15s}
        .info-item:hover{background:rgba(255,255,255,.03)}
        .info-item .info-label{font-size:0.6rem;color:#64748b;letter-spacing:0.03em;margin-bottom:0.2rem}
        .info-item .info-val{font-size:0.8rem;color:#cbd5e1}
        .info-item .info-val a{color:#38bdf8;text-decoration:none;transition:color .15s}
        .info-item .info-val a:hover{color:#7dd3fc}
        .info-divider{grid-column:1/-1;height:1px;background:#1c2d4a;margin:0 1rem}

        .loading{text-align:center;padding:4rem;color:#64748b}
        .error{text-align:center;padding:4rem;color:#ef4444}

        @media(max-width:700px){
            .charts-grid{grid-template-columns:1fr}
            .hero{grid-template-columns:1fr}
            body{padding:0 0.5rem 2rem}
        }
    </style>
</head>
<body>

<div id="app"><div class="loading">Φόρτωση δεδομένων...</div></div>

<script>
const API = '/api/v1';

async function get(url) {
    try { const r = await fetch(url); return r.ok ? r.json() : null; }
    catch(e) { return null; }
}

function val(data, keys) {
    for (const k of keys) if (data[k] != null) return parseFloat(data[k]);
    return null;
}

function fmtTime(iso) {
    return new Date(iso).toLocaleTimeString('el-GR', {hour:'2-digit', minute:'2-digit'});
}

function fmtDateTime(iso) {
    return new Date(iso).toLocaleString('el-GR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

const K = {
    temp: ['temperature','temp','ds18b20'],
    prs: ['pressure','prs','bmp280','bmp180'],
    sys: ['system_temperature','cpu_temp','system'],
    sig: ['signal','wifi','rssi','signal_strength','wifi_signal']
};

function makeChart(canvasId, data, labels, color) {
    const el = document.getElementById(canvasId);
    if (!el || data.length < 2) return;
    const ctx = el.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 200);
    grad.addColorStop(0, color + 'aa');
    grad.addColorStop(1, color + '22');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                data: data,
                borderColor: color,
                backgroundColor: grad,
                fill: true,
                tension: 0.3,
                pointRadius: 0,
                borderWidth: 1.5
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { color: '#1c2d4a' }, ticks: { color: '#64748b', font: { size: 9 }, maxTicksLimit: 8, maxRotation: 45 } },
                y: { grid: { color: '#1c2d4a' }, ticks: { color: '#64748b', font: { size: 10 } } }
            }
        }
    });
}

async function load() {
    const sensors = await get(`${API}/public/sensors/`);
    if (!sensors || !sensors.length) {
        document.getElementById('app').innerHTML = '<div class="error">Δεν υπάρχουν δημόσιοι αισθητήρες.</div>';
        return;
    }

    const loc = sensors[0].home_location || '';

    // Identify sensors by name/type
    let tempS = null, prsS = null, sysS = null, sigS = null;
    for (const s of sensors) {
        const n = s.name.toLowerCase(), t = (s.sensor_type||'').toLowerCase();
        if (!tempS && (n.includes('ds18b20') || t.includes('ds18b20'))) tempS = s;
        if (!prsS && (n.includes('bmp280') || t.includes('bmp280') || n.includes('pressure'))) prsS = s;
        if (!sysS && (n.includes('system') || n.includes('cpu'))) sysS = s;
        if (!sigS && (n.includes('wifi') || n.includes('signal'))) sigS = s;
    }

    // Fetch latest for all found sensors
    const found = [tempS, prsS, sysS, sigS].filter(Boolean);
    const uniqueIds = [...new Set(found.map(s => s.id))];
    const latestMap = {};
    await Promise.all(uniqueIds.map(async id => {
        latestMap[id] = await get(`${API}/public/sensors/${id}/readings/latest/`);
    }));

    const tempLatest = tempS ? latestMap[tempS.id] : null;
    const prsLatest = prsS ? latestMap[prsS.id] : null;

    const tempVal = tempLatest ? val(tempLatest.data, K.temp) : null;
    const prsVal = prsLatest ? val(prsLatest.data, K.prs) : null;

    // Fetch last 4h readings for all sensors
    const since = new Date(Date.now() - 4 * 3600000).toISOString();
    const readingsMap = {};
    await Promise.all(uniqueIds.map(async id => {
        const r = await get(`${API}/public/sensors/${id}/readings/?from_date=${since}&limit=1000`);
        const arr = r ? (r.results || r) : [];
        readingsMap[id] = arr.sort((a,b) => new Date(a.recorded_at) - new Date(b.recorded_at));
    }));

    const tempReadings = tempS ? readingsMap[tempS.id] || [] : [];
    const prsReadings = prsS ? readingsMap[prsS.id] || [] : [];
    const sysReadings = sysS ? readingsMap[sysS.id] || [] : [];
    const sigReadings = sigS ? readingsMap[sigS.id] || [] : [];

    // Compute min/max
    const tempVals = tempReadings.map(r => val(r.data, K.temp)).filter(v => v !== null);
    const prsVals = prsReadings.map(r => val(r.data, K.prs)).filter(v => v !== null);
    const tempMin = tempVals.length ? Math.min(...tempVals).toFixed(2) : '--';
    const tempMax = tempVals.length ? Math.max(...tempVals).toFixed(2) : '--';
    const prsMin = prsVals.length ? Math.min(...prsVals).toFixed(2) : '--';
    const prsMax = prsVals.length ? Math.max(...prsVals).toFixed(2) : '--';

    const lastDate = tempLatest ? fmtDateTime(tempLatest.recorded_at) : '--';

    // Build HTML
    let html = '';

    // Title
    html += `<div class="title-bar"><h1>Μετεωρολογικός σταθμός${loc ? '<br>' + loc : ''}</h1></div>`;

    // Current values - modern cards
    html += `<div class="hero">
        <div class="hero-card temp">
            <div class="accent"></div>
            <div class="hero-top">
                <div class="hero-icon">🌡️</div>
                <div><div class="hero-label">Θερμοκρασία</div><div class="hero-sensor">DS18B20</div></div>
            </div>
            <div class="hero-val">${tempVal !== null ? tempVal.toFixed(1) : '--'}<span class="hero-unit">°C</span></div>
            <div class="hero-range"><span class="lo">↓ ${tempMin}°</span><span class="hi">↑ ${tempMax}°</span></div>
            <div class="hero-time">${tempLatest ? fmtDateTime(tempLatest.recorded_at) : ''}</div>
        </div>
        <div class="hero-card prs">
            <div class="accent"></div>
            <div class="hero-top">
                <div class="hero-icon">🔵</div>
                <div><div class="hero-label">Βαρομετρική πίεση</div><div class="hero-sensor">BMP280</div></div>
            </div>
            <div class="hero-val">${prsVal !== null ? prsVal.toFixed(2) : '--'}<span class="hero-unit">hPa</span></div>
            <div class="hero-range"><span class="lo">↓ ${prsMin}</span><span class="hi">↑ ${prsMax}</span></div>
            <div class="hero-time">${prsLatest ? fmtDateTime(prsLatest.recorded_at) : ''}</div>
        </div>
    </div>`;


    // Charts info
    html += `<div class="charts-info">Στα διαγράμματα εμφανίζονται μετρήσεις για τις τελευταίες 4 ώρες.</div>`;

    // Charts 2x2
    html += '<div class="charts-grid">';
    if (tempReadings.length > 1) {
        html += `<div class="chart-card">
            <div class="ch-legend"><span class="swatch" style="background:#e06060"></span> Θερμοκρασία/Temperature (DS18B20 ±0.85%)</div>
            <canvas id="chTemp"></canvas></div>`;
    }
    if (prsReadings.length > 1) {
        html += `<div class="chart-card">
            <div class="ch-legend"><span class="swatch" style="background:#b060e0"></span> Βαρόμετρο / Pressure (BMP280 ±1 hPa)</div>
            <canvas id="chPrs"></canvas></div>`;
    }
    if (sysReadings.length > 1) {
        html += `<div class="chart-card">
            <div class="ch-legend"><span class="swatch" style="background:#60b060"></span> Θερμοκρασία συστήματος / System temperature</div>
            <canvas id="chSys"></canvas></div>`;
    }
    if (sigReadings.length > 1) {
        html += `<div class="chart-card">
            <div class="ch-legend"><span class="swatch" style="background:#50c8c8"></span> Ένταση WiFi / WiFi signal</div>
            <canvas id="chSig"></canvas></div>`;
    }
    html += '</div>';

    // Info section - modern grid
    html += `<div class="info-section">
        <div class="accent"></div>
        <div class="info-header"><span class="info-icon">ℹ️</span> Πληροφορίες</div>
        <div class="info-grid">
            <div class="info-item"><div class="info-label">Πόλη</div><div class="info-val">${loc || '--'}</div></div>
            <div class="info-item"><div class="info-label">Ανανέωση</div><div class="info-val">Κάθε 5 λεπτά</div></div>
            <div class="info-item"><div class="info-label">Τελευταία μέτρηση</div><div class="info-val">${lastDate}</div></div>
            <div class="info-item"><div class="info-label">Σύνολο αισθητήρων</div><div class="info-val">${sensors.length}</div></div>
            <div class="info-divider"></div>
            <div class="info-item"><div class="info-label">Ανοιχτά δεδομένα</div><div class="info-val"><a href="/api/docs/">Πληροφορίες API</a></div></div>
            <div class="info-item"><div class="info-label">Κώδικας στο Github</div><div class="info-val"><a href="https://github.com/tsaklidis/LogingAPIEnhanced">LogingAPI Project</a></div></div>
            <div class="info-item"><div class="info-label">Developed by</div><div class="info-val"><a href="https://github.com/tsaklidis">Stefanos I. Tsaklidis</a></div></div>
        </div>
    </div>`;

    document.getElementById('app').innerHTML = html;

    // Render charts
    if (tempReadings.length > 1) {
        makeChart('chTemp', tempReadings.map(r => val(r.data, K.temp)), tempReadings.map(r => fmtTime(r.recorded_at)), '#e06060');
    }
    if (prsReadings.length > 1) {
        makeChart('chPrs', prsReadings.map(r => val(r.data, K.prs)), prsReadings.map(r => fmtTime(r.recorded_at)), '#b060e0');
    }
    if (sysReadings.length > 1) {
        makeChart('chSys', sysReadings.map(r => val(r.data, K.sys) || val(r.data, K.temp)), sysReadings.map(r => fmtTime(r.recorded_at)), '#60b060');
    }
    if (sigReadings.length > 1) {
        makeChart('chSig', sigReadings.map(r => val(r.data, K.sig)), sigReadings.map(r => fmtTime(r.recorded_at)), '#50c8c8');
    }
}

load();
setInterval(() => location.reload(), 5 * 60 * 1000);
</script>
</body>
</html>
