<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Μετρήσεις Αισθητήρων - Home Sensor Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --accent: #38bdf8;
            --accent-green: #34d399;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #334155;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
        }

        .header {
            text-align: center;
            padding: 3rem 1rem 2rem;
            background: linear-gradient(180deg, #1e293b 0%, transparent 100%);
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .header .location {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .sensor-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            transition: border-color 0.2s;
        }

        .sensor-card:hover { border-color: var(--accent); }

        .sensor-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .sensor-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .sensor-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
        }

        .sensor-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .metric-card {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
        }

        .metric-card.temp::before { background: linear-gradient(90deg, #ef4444, #f97316); }
        .metric-card.hum::before { background: linear-gradient(90deg, #06b6d4, #3b82f6); }
        .metric-card.prs::before { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
        .metric-card.bat::before { background: linear-gradient(90deg, #22c55e, #84cc16); }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1;
        }

        .metric-value .unit {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-secondary);
        }

        .metric-card.temp .metric-value { color: #fb923c; }
        .metric-card.hum .metric-value { color: #38bdf8; }
        .metric-card.prs .metric-value { color: #a78bfa; }
        .metric-card.bat .metric-value { color: #4ade80; }

        .metric-minmax {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .chart-container {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        .chart-title {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 0.75rem;
        }

        .chart-wrapper {
            position: relative;
            height: 180px;
        }

        .last-update {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0.35rem 0.75rem;
            margin-top: 1rem;
        }

        .last-update .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .footer {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }

        .footer a { color: var(--accent); text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        .empty-state {
            text-align: center;
            padding: 5rem 2rem;
        }

        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.6; }
        .empty-state h2 { font-size: 1.3rem; font-weight: 600; color: var(--text-secondary); }
        .empty-state p { color: var(--text-muted); font-size: 0.9rem; }

        .loading-state { text-align: center; padding: 5rem 2rem; }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.5rem; }
            .sensor-card { padding: 1.5rem; }
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
            .metric-value { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🌡️ Μετρήσεις Αισθητήρων</h1>
    <p class="location" id="location"></p>
</div>

<div class="container" style="max-width: 900px;">
    <div id="dashboard">
        <div class="loading-state">
            <div class="spinner"></div>
            <p style="color: var(--text-muted);">Φόρτωση δεδομένων...</p>
        </div>
    </div>
</div>

<div class="footer">
    Powered by <strong>Home Sensor Platform</strong> ·
    <a href="/api/docs/">API Docs</a> ·
    <a href="https://github.com/tsaklidis/LogingAPIEnhanced">GitHub</a>
    <br>
    <span style="margin-top: 0.25rem; display: inline-block;">Αυτόματη ανανέωση κάθε 5 λεπτά</span>
</div>

<script>
const API = '/api/v1';

const COLORS = {
    temp: { line: '#f97316', gradient: ['rgba(249,115,22,0.3)', 'rgba(249,115,22,0)'] },
    hum:  { line: '#38bdf8', gradient: ['rgba(56,189,248,0.3)', 'rgba(56,189,248,0)'] },
    prs:  { line: '#a78bfa', gradient: ['rgba(167,139,250,0.3)', 'rgba(167,139,250,0)'] },
};

const KEYS = {
    temp: ['temperature', 'temp', 'ds18b20'],
    hum: ['humidity', 'hum', 'dht22_h'],
    prs: ['pressure', 'prs', 'bmp280', 'bmp180'],
    bat: ['battery_percentage', 'battery', 'bat'],
};

async function fetchJSON(url) {
    try {
        const res = await fetch(url);
        if (!res.ok) return null;
        return res.json();
    } catch { return null; }
}

function getValue(data, keys) {
    for (const k of keys) {
        if (data[k] !== undefined && data[k] !== null) return parseFloat(data[k]);
    }
    return null;
}

function formatTime(iso) {
    return new Date(iso).toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' });
}

function formatDateTime(iso) {
    return new Date(iso).toLocaleString('el-GR', { dateStyle: 'short', timeStyle: 'short' });
}

function createGradient(ctx, color) {
    const g = ctx.createLinearGradient(0, 0, 0, 180);
    g.addColorStop(0, color.gradient[0]);
    g.addColorStop(1, color.gradient[1]);
    return g;
}

function buildChart(canvas, label, readings, valueKeys, color) {
    if (!canvas || !readings.length) return;
    const sorted = [...readings].sort((a, b) => new Date(a.recorded_at) - new Date(b.recorded_at));
    const labels = sorted.map(r => formatTime(r.recorded_at));
    const data = sorted.map(r => getValue(r.data, valueKeys));
    if (data.every(v => v === null)) return;

    const ctx = canvas.getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels,
            datasets: [{
                label,
                data,
                borderColor: color.line,
                backgroundColor: createGradient(ctx, color),
                fill: true,
                tension: 0.4,
                pointRadius: 0,
                pointHoverRadius: 5,
                pointHoverBackgroundColor: color.line,
                pointHoverBorderColor: '#fff',
                pointHoverBorderWidth: 2,
                borderWidth: 2,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#1e293b',
                    titleColor: '#f1f5f9',
                    bodyColor: '#94a3b8',
                    borderColor: '#334155',
                    borderWidth: 1,
                    cornerRadius: 8,
                    padding: 10,
                    displayColors: false,
                }
            },
            scales: {
                x: {
                    grid: { color: 'rgba(51,65,85,0.5)', drawBorder: false },
                    ticks: { color: '#64748b', font: { size: 10 }, maxTicksLimit: 6, maxRotation: 0 },
                },
                y: {
                    grid: { color: 'rgba(51,65,85,0.5)', drawBorder: false },
                    ticks: { color: '#64748b', font: { size: 10 }, padding: 8 },
                }
            }
        }
    });
}

function metricHTML(type, label, value, unit, min, max) {
    if (value === null) return '';
    const minmax = (min !== null && max !== null && min !== max)
        ? `<div class="metric-minmax">↓ ${min.toFixed(1)} / ↑ ${max.toFixed(1)}</div>` : '';
    return `
        <div class="metric-card ${type}">
            <div class="metric-label">${label}</div>
            <div class="metric-value">${value.toFixed(1)}<span class="unit">${unit}</span></div>
            ${minmax}
        </div>`;
}

async function loadDashboard() {
    const sensors = await fetchJSON(`${API}/public/sensors/`);

    if (!sensors || sensors.length === 0) {
        document.getElementById('dashboard').innerHTML = `
            <div class="empty-state">
                <div class="icon">📡</div>
                <h2>Δεν υπάρχουν δημόσιοι αισθητήρες</h2>
                <p>Δεν βρέθηκαν αισθητήρες σε δημόσιους χώρους αυτή τη στιγμή.</p>
            </div>`;
        return;
    }

    const loc = sensors[0].home_location;
    if (loc) document.getElementById('location').textContent = '📍 ' + loc;

    let html = '';

    for (const sensor of sensors) {
        const latest = await fetchJSON(`${API}/public/sensors/${sensor.id}/readings/latest/`);
        const since = new Date(Date.now() - 4*60*60*1000).toISOString();
        const res = await fetchJSON(`${API}/public/sensors/${sensor.id}/readings/?recorded_at_after=${since}&page_size=500`);
        const readings = res ? (res.results || res) : [];

        const data = latest ? latest.data : {};
        const temp = getValue(data, KEYS.temp);
        const hum = getValue(data, KEYS.hum);
        const prs = getValue(data, KEYS.prs);
        const bat = getValue(data, KEYS.bat);

        const temps = readings.map(r => getValue(r.data, KEYS.temp)).filter(v => v !== null);
        const hums = readings.map(r => getValue(r.data, KEYS.hum)).filter(v => v !== null);
        const press = readings.map(r => getValue(r.data, KEYS.prs)).filter(v => v !== null);

        const cid = sensor.id.replace(/-/g, '');

        html += `
        <div class="sensor-card">
            <div class="sensor-header">
                <div class="sensor-icon">📊</div>
                <div>
                    <p class="sensor-name">${sensor.name}</p>
                    <span class="sensor-meta">${sensor.sensor_type} · ${sensor.space_name}</span>
                </div>
            </div>

            <div class="metrics-grid">
                ${metricHTML('temp', 'Θερμοκρασία', temp, '°C', temps.length ? Math.min(...temps) : null, temps.length ? Math.max(...temps) : null)}
                ${metricHTML('hum', 'Υγρασία', hum, '%', hums.length ? Math.min(...hums) : null, hums.length ? Math.max(...hums) : null)}
                ${metricHTML('prs', 'Πίεση', prs, ' hPa', press.length ? Math.min(...press) : null, press.length ? Math.max(...press) : null)}
                ${metricHTML('bat', 'Μπαταρία', bat, '%', null, null)}
            </div>

            ${temps.length > 1 ? `<div class="chart-container"><div class="chart-title">Θερμοκρασία — τελευταίες 4 ώρες</div><div class="chart-wrapper"><canvas id="ct_${cid}"></canvas></div></div>` : ''}
            ${hums.length > 1 ? `<div class="chart-container"><div class="chart-title">Υγρασία — τελευταίες 4 ώρες</div><div class="chart-wrapper"><canvas id="ch_${cid}"></canvas></div></div>` : ''}
            ${press.length > 1 ? `<div class="chart-container"><div class="chart-title">Βαρομετρική πίεση — τελευταίες 4 ώρες</div><div class="chart-wrapper"><canvas id="cp_${cid}"></canvas></div></div>` : ''}

            ${latest ? `<div class="last-update"><span class="dot"></span> Τελευταία μέτρηση: ${formatDateTime(latest.recorded_at)}</div>` : ''}
        </div>`;
    }

    document.getElementById('dashboard').innerHTML = html;

    // Build charts
    for (const sensor of sensors) {
        const since = new Date(Date.now() - 4*60*60*1000).toISOString();
        const res = await fetchJSON(`${API}/public/sensors/${sensor.id}/readings/?recorded_at_after=${since}&page_size=500`);
        const readings = res ? (res.results || res) : [];
        if (readings.length < 2) continue;
        const cid = sensor.id.replace(/-/g, '');
        buildChart(document.getElementById(`ct_${cid}`), 'Θερμοκρασία (°C)', readings, KEYS.temp, COLORS.temp);
        buildChart(document.getElementById(`ch_${cid}`), 'Υγρασία (%)', readings, KEYS.hum, COLORS.hum);
        buildChart(document.getElementById(`cp_${cid}`), 'Πίεση (hPa)', readings, KEYS.prs, COLORS.prs);
    }
}

loadDashboard();
setInterval(() => location.reload(), 5 * 60 * 1000);
</script>
</body>
</html>
