<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sensor Logs</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0c1222;
            --bg2: #111a2e;
            --bg-card: #15203a;
            --border: #1c2d4a;
            --accent: #38bdf8;
            --green: #22c55e;
            --orange: #f97316;
            --red: #ef4444;
            --purple: #a78bfa;
            --yellow: #eab308;
            --rose: #fb7185;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --text3: #64748b;
            --radius: 12px;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

        /* Top bar */
        .topbar{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;background:var(--bg2);border-bottom:1px solid var(--border)}
        .topbar-left{display:flex;align-items:center;gap:.75rem}
        .logo-icon{color:var(--accent);font-size:1.3rem}
        .logo-text{font-size:1.1rem;font-weight:700;letter-spacing:-.02em}
        .logo-sub{font-size:.65rem;color:var(--text3);margin-top:1px}
        .topbar-center{text-align:center}
        .topbar-loc{font-size:.9rem;font-weight:500}
        .topbar-time{font-size:.65rem;color:var(--text3);margin-top:2px;display:flex;align-items:center;justify-content:center;gap:.35rem}
        .topbar-time .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
        .topbar-right{display:flex;align-items:center;gap:.75rem}
        .lang-btn{background:var(--bg);border:1px solid var(--border);color:var(--text2);font-size:.7rem;padding:.3rem .6rem;border-radius:6px;cursor:pointer;font-family:inherit}
        .lang-btn:hover{border-color:var(--accent);color:var(--text)}
        .badge-online{font-size:.65rem;font-weight:600;color:var(--green);border:1px solid var(--green);border-radius:20px;padding:.25rem .65rem;display:flex;align-items:center;gap:.35rem}
        .badge-online .bdot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

        /* Layout */
        .main{max-width:1100px;margin:0 auto;padding:1.5rem 1.25rem}

        /* Hero weather display */
        .hero-weather{display:flex;align-items:flex-end;gap:2.5rem;padding:2rem 0 1.5rem;border-bottom:1px solid var(--border);margin-bottom:1.5rem;flex-wrap:wrap}
        .hero-primary{flex:1;min-width:200px}
        .hero-primary .h-label{font-size:.7rem;color:var(--text3);margin-bottom:.25rem}
        .hero-primary .h-val{font-size:3.5rem;font-weight:800;line-height:1;color:var(--orange);letter-spacing:-.03em}
        .hero-primary .h-val .h-unit{font-size:1.5rem;font-weight:400;color:var(--text2)}
        .hero-primary .h-range{font-size:.7rem;color:var(--text3);margin-top:.4rem}
        .hero-secondary{display:flex;gap:2rem;flex-wrap:wrap}
        .hero-stat{text-align:left}
        .hero-stat .hs-label{font-size:.6rem;color:var(--text3);margin-bottom:.15rem}
        .hero-stat .hs-val{font-size:1.5rem;font-weight:700;line-height:1.1}
        .hero-stat .hs-val .hs-unit{font-size:.7rem;font-weight:400;color:var(--text2)}
        .hero-stat.prs .hs-val{color:var(--purple)}
        .hero-stat.cnt .hs-val{color:var(--accent)}
        .hero-stat .hs-sub{font-size:.55rem;color:var(--text3);margin-top:.1rem}

        /* Section labels */
        .sec-label{font-size:.7rem;color:var(--text3);margin:1.75rem 0 .6rem;font-weight:500;display:flex;align-items:center;gap:.4rem}
        .sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

        /* Metric rows - clean list style */
        .metric-list{display:flex;flex-direction:column;gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:1rem}
        .ml-item{display:flex;align-items:center;padding:.85rem 1.1rem;background:var(--bg-card);gap:1rem}
        .ml-item:hover{background:var(--bg2)}
        .ml-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
        .ml-dot.temp{background:var(--orange)}
        .ml-dot.hum{background:var(--accent)}
        .ml-dot.prs{background:var(--purple)}
        .ml-dot.bat{background:var(--green)}
        .ml-dot.sig{background:var(--yellow)}
        .ml-dot.sys{background:var(--rose)}
        .ml-name{flex:1;font-size:.8rem;color:var(--text2)}
        .ml-label{font-size:.65rem;color:var(--text3);width:80px;text-align:right}
        .ml-val{font-size:1.1rem;font-weight:700;min-width:90px;text-align:right}
        .ml-val.temp{color:var(--orange)}
        .ml-val.hum{color:var(--accent)}
        .ml-val.prs{color:var(--purple)}
        .ml-val.bat{color:var(--green)}
        .ml-val.sig{color:var(--yellow)}
        .ml-val.sys{color:var(--rose)}
        .ml-unit{font-size:.7rem;font-weight:400;color:var(--text3);margin-left:2px}
        .ml-range{font-size:.6rem;color:var(--text3);min-width:100px;text-align:right}

        /* Charts */
        .charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:.75rem;margin-bottom:1rem}
        .ch-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem}
        .ch-title{font-size:.75rem;font-weight:500;color:var(--text2);margin-bottom:.85rem}
        .ch-wrap{position:relative;height:200px}

        /* Footer */
        .footer{text-align:center;padding:2rem 1rem;color:var(--text3);font-size:.7rem;border-top:1px solid var(--border);margin-top:2rem}
        .footer a{color:var(--accent);text-decoration:none}

        /* States */
        .empty-state{text-align:center;padding:5rem 2rem}
        .empty-state h2{font-size:1.1rem;color:var(--text2)}
        .empty-state p{color:var(--text3);font-size:.85rem;margin-top:.5rem}
        .loading-state{text-align:center;padding:5rem 2rem}
        .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1rem}
        @keyframes spin{to{transform:rotate(360deg)}}

        @media(max-width:700px){
            .topbar{flex-wrap:wrap;gap:.5rem;padding:1rem}
            .topbar-center{order:3;width:100%;margin-top:.25rem}
            .hero-weather{gap:1.5rem}
            .hero-primary .h-val{font-size:2.5rem}
            .ml-range{display:none}
            .ch-wrap{height:160px}
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <span class="logo-icon">〰️</span>
        <div>
            <div class="logo-text" data-i18n="title">Sensor Logs</div>
            <div class="logo-sub" data-i18n="subtitle">Realtime sensor monitoring</div>
        </div>
    </div>
    <div class="topbar-center">
        <div class="topbar-loc" id="location"></div>
        <div class="topbar-time"><span class="dot"></span><span id="last-update"></span></div>
    </div>
    <div class="topbar-right">
        <button class="lang-btn" id="lang-toggle" onclick="toggleLang()">GR</button>
        <div class="badge-online"><span class="bdot"></span> online</div>
    </div>
</div>

<div class="main" id="dashboard">
    <div class="loading-state"><div class="spinner"></div><p style="color:var(--text3)" data-i18n="loading">Loading...</p></div>
</div>

<div class="footer">
    <strong>Home Sensor Platform</strong> · <a href="/api/docs/">API</a> · <a href="https://github.com/tsaklidis/LogingAPIEnhanced">GitHub</a>
</div>

<script>
const API='/api/v1';

// --- i18n ---
let lang = localStorage.getItem('lang') || 'en';

const I18N = {
    en: {
        title: 'Sensor Logs',
        subtitle: 'Realtime sensor monitoring',
        loading: 'Loading...',
        avgTemp: 'Avg. temperature',
        pressure: 'Pressure',
        sensors: 'Sensors',
        active: 'active',
        wifiSignal: 'Wifi signal',
        good: 'Good', poor: 'Poor', fair: 'Fair',
        weather: 'Weather sensors',
        system: 'System & network',
        history: 'History (4 hours)',
        temperature: 'Temperature',
        humidity: 'Humidity',
        pressureLabel: 'Pressure',
        signal: 'Signal',
        battery: 'Battery',
        voltage: 'Voltage',
        systemTemp: 'System temp.',
        lastUpdate: 'Last update',
        noSensors: 'No public sensors',
        noSensorsDesc: 'No sensors found in public spaces.',
        tempChart: 'Temperature — 4 hours',
        humChart: 'Humidity — 4 hours',
        prsChart: 'Barometric pressure — 4 hours',
        sysChart: 'System temperature — 4 hours',
        nSensors: 'sensors',
        weatherHistory: 'Weather history (4 hours)',
        systemHistory: 'System history (4 hours)',
    },
    el: {
        title: 'Sensor Logs',
        subtitle: 'Παρακολούθηση αισθητήρων',
        loading: 'Φόρτωση...',
        avgTemp: 'Μέση θερμοκρασία',
        pressure: 'Πίεση',
        sensors: 'Αισθητήρες',
        active: 'ενεργοί',
        wifiSignal: 'Σήμα wifi',
        good: 'Καλό', poor: 'Χαμηλό', fair: 'Μέτριο',
        weather: 'Αισθητήρες καιρού',
        system: 'Σύστημα & δίκτυο',
        history: 'Ιστορικό (4 ώρες)',
        temperature: 'Θερμοκρασία',
        humidity: 'Υγρασία',
        pressureLabel: 'Πίεση',
        signal: 'Σήμα',
        battery: 'Μπαταρία',
        voltage: 'Τάση',
        systemTemp: 'Θερμ. συστήματος',
        lastUpdate: 'Τελευταία ενημέρωση',
        noSensors: 'Δεν υπάρχουν αισθητήρες',
        noSensorsDesc: 'Δεν βρέθηκαν αισθητήρες σε δημόσιους χώρους.',
        tempChart: 'Θερμοκρασία — 4 ώρες',
        humChart: 'Υγρασία — 4 ώρες',
        prsChart: 'Βαρομετρική πίεση — 4 ώρες',
        sysChart: 'Θερμοκρασία συστήματος — 4 ώρες',
        nSensors: 'αισθ.',
        weatherHistory: 'Ιστορικό καιρού (4 ώρες)',
        systemHistory: 'Ιστορικό συστήματος (4 ώρες)',
    }
};

function t(key){ return I18N[lang][key] || key; }

function toggleLang(){
    lang = lang==='en'?'el':'en';
    localStorage.setItem('lang', lang);
    location.reload();
}

function applyLang(){
    document.getElementById('lang-toggle').textContent = lang==='en'?'GR':'EN';
    document.querySelectorAll('[data-i18n]').forEach(el=>{
        const k=el.getAttribute('data-i18n');
        if(I18N[lang][k]) el.textContent=I18N[lang][k];
    });
}

// --- Data helpers ---
const KEYS={
    temp:['temperature','temp','ds18b20'],
    hum:['humidity','hum','dht22_h'],
    prs:['pressure','prs','bmp280','bmp180'],
    bat:['battery_percentage','battery','bat','battery_lvl'],
    sig:['signal','wifi','rssi','signal_strength','wifi_signal'],
    batv:['battery_voltage','batt_voltage','voltage'],
    sys:['system_temperature','cpu_temp','system'],
};
const CHART_C={
    temp:{line:'#f97316',bg:['rgba(249,115,22,.2)','rgba(249,115,22,0)']},
    hum:{line:'#38bdf8',bg:['rgba(56,189,248,.2)','rgba(56,189,248,0)']},
    prs:{line:'#a78bfa',bg:['rgba(167,139,250,.2)','rgba(167,139,250,0)']},
    sys:{line:'#fb7185',bg:['rgba(251,113,133,.2)','rgba(251,113,133,0)']},
};

async function fetchJSON(u){try{const r=await fetch(u);if(!r.ok)return null;return r.json()}catch{return null}}
function gv(d,keys){for(const k of keys){if(d[k]!==undefined&&d[k]!==null)return parseFloat(d[k])}return null}
function fmt(iso){return new Date(iso).toLocaleTimeString(lang==='el'?'el-GR':'en-GB',{hour:'2-digit',minute:'2-digit'})}
function fmtDT(iso){return new Date(iso).toLocaleString(lang==='el'?'el-GR':'en-GB',{dateStyle:'short',timeStyle:'short'})}
function sigLabel(v){if(v===null)return '';if(v>-50)return t('good');if(v>-70)return t('fair');return t('poor')}

function grad(ctx,c){const g=ctx.createLinearGradient(0,0,0,220);g.addColorStop(0,c.bg[0]);g.addColorStop(1,c.bg[1]);return g}

function makeChart(canvas,datasets){
    if(!canvas)return;
    const ctx=canvas.getContext('2d');
    // Give each dataset a slightly different shade if multiple
    const shades=['','cc','99'];
    new Chart(ctx,{
        type:'line',
        data:{labels:datasets[0].labels,datasets:datasets.map((ds,i)=>({
            label:ds.label,data:ds.data,
            borderColor:ds.color.line+(shades[i]||''),
            backgroundColor:grad(ctx,ds.color),
            fill:i===0,tension:.4,pointRadius:0,pointHoverRadius:4,
            pointHoverBackgroundColor:ds.color.line,pointHoverBorderColor:'#fff',
            pointHoverBorderWidth:2,borderWidth:2,
        }))},
        options:{
            responsive:true,maintainAspectRatio:false,
            interaction:{mode:'index',intersect:false},
            plugins:{
                legend:{display:datasets.length>1,position:'top',labels:{color:'#94a3b8',boxWidth:8,boxHeight:8,font:{size:10},padding:10,usePointStyle:true}},
                tooltip:{backgroundColor:'#1e293b',titleColor:'#f1f5f9',bodyColor:'#94a3b8',borderColor:'#334155',borderWidth:1,cornerRadius:8,padding:10,displayColors:true,boxWidth:8}
            },
            scales:{
                x:{grid:{color:'rgba(30,45,69,.5)',drawBorder:false},ticks:{color:'#475569',font:{size:9},maxTicksLimit:6,maxRotation:0}},
                y:{grid:{color:'rgba(30,45,69,.5)',drawBorder:false},ticks:{color:'#475569',font:{size:9},padding:8}}
            }
        }
    });
}

function mRow(type,label,value,unit,name,min,max){
    if(value===null)return '';
    const range=(min!==null&&max!==null&&Math.abs(max-min)>0.05)?`<span class="ml-range">↓${min.toFixed(1)} ↑${max.toFixed(1)}</span>`:'<span class="ml-range"></span>';
    return `<div class="ml-item">
        <span class="ml-dot ${type}"></span>
        <span class="ml-name">${name}</span>
        <span class="ml-label">${label}</span>
        <span class="ml-val ${type}">${typeof value==='number'?value.toFixed(1):value}<span class="ml-unit">${unit}</span></span>
        ${range}
    </div>`;
}

// --- Sensor classification ---
// Weather sensors: DS18B20, BMP280_Pressure, humidity sensors, standalone temp/hum/prs
// System sensors: System_Temperature, BMP280_Temperature, WiFi_Signal, battery, voltage
function isSystemSensor(name, data){
    const n = name.toLowerCase();
    if(n.includes('system') || n.includes('wifi') || n.includes('signal')) return true;
    // BMP280_Temperature is internal chip temp, not weather
    if(n.includes('bmp') && n.includes('temp')) return true;
    // If it only has system_temperature data
    if(gv(data,KEYS.sys)!==null && gv(data,KEYS.temp)===null) return true;
    return false;
}

function isWeatherSensor(name, data){
    const n = name.toLowerCase();
    // DS18B20 is the weather temperature probe
    if(n.includes('ds18b20')) return true;
    // BMP280_Pressure is weather barometric data
    if(n.includes('pressure') || n.includes('bmp') && !n.includes('temp')) return true;
    // Humidity sensors
    if(n.includes('dht') || n.includes('hum')) return true;
    // If sensor has temp/hum/prs and is NOT system
    if(!isSystemSensor(name, data)) return true;
    return false;
}

// --- Main ---
async function loadDashboard(){
    const sensors=await fetchJSON(`${API}/public/sensors/`);
    if(!sensors||!sensors.length){
        document.getElementById('dashboard').innerHTML=`<div class="empty-state"><h2>${t('noSensors')}</h2><p>${t('noSensorsDesc')}</p></div>`;
        return;
    }

    const loc=sensors[0].home_location;
    if(loc) document.getElementById('location').textContent='📍 '+loc;

    const allData=await Promise.all(sensors.map(async s=>{
        const since=new Date(Date.now()-4*3600000).toISOString();
        const[latest,res]=await Promise.all([
            fetchJSON(`${API}/public/sensors/${s.id}/readings/latest/`),
            fetchJSON(`${API}/public/sensors/${s.id}/readings/?recorded_at_after=${since}&page_size=500`)
        ]);
        const readings=(res?(res.results||res):[]).sort((a,b)=>new Date(a.recorded_at)-new Date(b.recorded_at));
        return{...s,latest,readings};
    }));

    // Classify & collect
    let weatherCards=[],sysCards=[];
    let wCharts={temp:[],hum:[],prs:[]}, sCharts={sys:[],sig:[]};
    let lastUpdate=null;
    let heroTemp=null, heroTempRange=null, heroPrs=null;

    for(const s of allData){
        const d=s.latest?s.latest.data:{};
        const r=s.readings;
        const nm=s.name;
        const isSys=isSystemSensor(nm, d);

        const temp=gv(d,KEYS.temp),hum=gv(d,KEYS.hum),prs=gv(d,KEYS.prs);
        const bat=gv(d,KEYS.bat),sig=gv(d,KEYS.sig),batv=gv(d,KEYS.batv),sys=gv(d,KEYS.sys);

        const tv=r.map(x=>gv(x.data,KEYS.temp)).filter(v=>v!==null);
        const hv=r.map(x=>gv(x.data,KEYS.hum)).filter(v=>v!==null);
        const pv=r.map(x=>gv(x.data,KEYS.prs)).filter(v=>v!==null);
        const sv=r.map(x=>gv(x.data,KEYS.sys)).filter(v=>v!==null);

        if(!isSys){
            // Weather sensors
            if(temp!==null){
                weatherCards.push(mRow('temp',t('temperature'),temp,'°C',nm,tv.length?Math.min(...tv):null,tv.length?Math.max(...tv):null));
                if(nm.toLowerCase().includes('ds18b20')){ heroTemp=temp; heroTempRange=tv.length?{min:Math.min(...tv),max:Math.max(...tv)}:null; }
            }
            if(hum!==null) weatherCards.push(mRow('hum',t('humidity'),hum,'%',nm,hv.length?Math.min(...hv):null,hv.length?Math.max(...hv):null));
            if(prs!==null){ weatherCards.push(mRow('prs',t('pressureLabel'),prs,'hPa',nm,pv.length?Math.min(...pv):null,pv.length?Math.max(...pv):null)); heroPrs=prs; }
            if(bat!==null) weatherCards.push(mRow('bat',t('battery'),bat,'%',nm,null,null));
            if(batv!==null) weatherCards.push(mRow('bat',t('voltage'),batv,'V',nm,null,null));
            // Weather charts
            if(tv.length>1){const labels=r.map(x=>fmt(x.recorded_at));wCharts.temp.push({label:nm,data:r.map(x=>gv(x.data,KEYS.temp)),labels,color:CHART_C.temp})}
            if(hv.length>1){const labels=r.map(x=>fmt(x.recorded_at));wCharts.hum.push({label:nm,data:r.map(x=>gv(x.data,KEYS.hum)),labels,color:CHART_C.hum})}
            if(pv.length>1){const labels=r.map(x=>fmt(x.recorded_at));wCharts.prs.push({label:nm,data:r.map(x=>gv(x.data,KEYS.prs)),labels,color:CHART_C.prs})}
        } else {
            // System sensors
            if(sys!==null) sysCards.push(mRow('sys',t('systemTemp'),sys,'°C',nm,sv.length?Math.min(...sv):null,sv.length?Math.max(...sv):null));
            if(temp!==null) sysCards.push(mRow('sys',t('temperature'),temp,'°C',nm,tv.length?Math.min(...tv):null,tv.length?Math.max(...tv):null));
            if(prs!==null) sysCards.push(mRow('prs',t('pressureLabel'),prs,'hPa',nm,pv.length?Math.min(...pv):null,pv.length?Math.max(...pv):null));
            if(sig!==null) sysCards.push(mRow('sig',t('signal'),sig,'dBm',nm,null,null));
            if(bat!==null) sysCards.push(mRow('bat',t('battery'),bat,'%',nm,null,null));
            // System charts
            if(sv.length>1){const labels=r.map(x=>fmt(x.recorded_at));sCharts.sys.push({label:nm,data:r.map(x=>gv(x.data,KEYS.sys)),labels,color:CHART_C.sys})}
            if(tv.length>1){const labels=r.map(x=>fmt(x.recorded_at));sCharts.sys.push({label:nm,data:r.map(x=>gv(x.data,KEYS.temp)),labels,color:CHART_C.sys})}
        }

        if(s.latest) lastUpdate=s.latest.recorded_at;
    }

    if(lastUpdate) document.getElementById('last-update').textContent=`${t('lastUpdate')}: ${fmtDT(lastUpdate)}`;

    // --- Build HTML ---

    // Weather hero: big temperature + pressure
    let heroHtml='';
    if(heroTemp!==null || heroPrs!==null){
        heroHtml=`<div class="hero-weather"><div class="hero-primary">`;
        heroHtml+=`<div class="h-label">${t('temperature')}</div>`;
        heroHtml+=`<div class="h-val">${heroTemp!==null?heroTemp.toFixed(1):'--'}<span class="h-unit">°C</span></div>`;
        if(heroTempRange) heroHtml+=`<div class="h-range">↓ ${heroTempRange.min.toFixed(1)}° / ↑ ${heroTempRange.max.toFixed(1)}°</div>`;
        heroHtml+=`</div><div class="hero-secondary">`;
        if(heroPrs!==null) heroHtml+=`<div class="hero-stat prs"><div class="hs-label">${t('pressureLabel')}</div><div class="hs-val">${heroPrs.toFixed(0)}<span class="hs-unit"> hPa</span></div></div>`;
        heroHtml+=`<div class="hero-stat cnt"><div class="hs-label">${t('sensors')}</div><div class="hs-val">${allData.length}</div><div class="hs-sub">${t('active')}</div></div>`;
        heroHtml+=`</div></div>`;
    }

    // Weather charts
    let wChartsHtml='';
    if(wCharts.temp.length) wChartsHtml+=`<div class="ch-card"><div class="ch-title">🌡️ ${t('tempChart')}</div><div class="ch-wrap"><canvas id="ch_temp"></canvas></div></div>`;
    if(wCharts.hum.length) wChartsHtml+=`<div class="ch-card"><div class="ch-title">💧 ${t('humChart')}</div><div class="ch-wrap"><canvas id="ch_hum"></canvas></div></div>`;
    if(wCharts.prs.length) wChartsHtml+=`<div class="ch-card"><div class="ch-title">🔵 ${t('prsChart')}</div><div class="ch-wrap"><canvas id="ch_prs"></canvas></div></div>`;

    // System charts
    let sChartsHtml='';
    if(sCharts.sys.length) sChartsHtml+=`<div class="ch-card"><div class="ch-title">🖥️ ${t('sysChart')}</div><div class="ch-wrap"><canvas id="ch_sys"></canvas></div></div>`;

    document.getElementById('dashboard').innerHTML=`
        ${heroHtml}
        ${weatherCards.length?`<div class="sec-label">${t('weather')}</div><div class="metric-list">${weatherCards.join('')}</div>`:''}
        ${wChartsHtml?`<div class="sec-label">${t('weatherHistory')}</div><div class="charts-grid">${wChartsHtml}</div>`:''}
        ${sysCards.length?`<div class="sec-label">${t('system')}</div><div class="metric-list">${sysCards.join('')}</div>`:''}
        ${sChartsHtml?`<div class="sec-label">${t('systemHistory')}</div><div class="charts-grid">${sChartsHtml}</div>`:''}
    `;

    if(wCharts.temp.length) makeChart(document.getElementById('ch_temp'),wCharts.temp);
    if(wCharts.hum.length) makeChart(document.getElementById('ch_hum'),wCharts.hum);
    if(wCharts.prs.length) makeChart(document.getElementById('ch_prs'),wCharts.prs);
    if(sCharts.sys.length) makeChart(document.getElementById('ch_sys'),sCharts.sys);
}

applyLang();
loadDashboard();
setInterval(()=>location.reload(),5*60*1000);
</script>
</body>
</html>
