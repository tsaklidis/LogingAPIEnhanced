<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sensor Logs</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root{--bg:#0c1222;--bg2:#111a2e;--bg-card:#152035;--border:#1c2d4a;--accent:#38bdf8;--green:#22c55e;--orange:#f97316;--red:#ef4444;--purple:#a78bfa;--yellow:#eab308;--rose:#fb7185;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--radius:14px}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

        .topbar{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:var(--bg2);border-bottom:1px solid var(--border)}
        .topbar-left{display:flex;align-items:center;gap:.75rem}
        .logo-icon{color:var(--accent);font-size:1.4rem}
        .logo-text{font-size:1.15rem;font-weight:700}
        .logo-sub{font-size:.65rem;color:var(--text3)}
        .topbar-center{text-align:center}
        .topbar-loc{font-size:.95rem;font-weight:500}
        .topbar-time{font-size:.65rem;color:var(--text3);margin-top:2px;display:flex;align-items:center;justify-content:center;gap:.35rem}
        .topbar-time .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
        .topbar-right{display:flex;align-items:center;gap:.75rem}
        .lang-btn{background:var(--bg);border:1px solid var(--border);color:var(--text2);font-size:.7rem;padding:.35rem .7rem;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:500}
        .lang-btn:hover{border-color:var(--accent);color:var(--text)}
        .badge-online{font-size:.65rem;font-weight:600;color:var(--green);border:1.5px solid var(--green);border-radius:20px;padding:.3rem .7rem;display:flex;align-items:center;gap:.35rem}
        .badge-online .bdot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

        .main{max-width:1300px;margin:0 auto;padding:1.5rem 2rem}

        /* Hero row */
        .hero-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem;margin-bottom:1.75rem}
        .hero-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;display:flex;align-items:center;gap:1rem;position:relative;overflow:hidden}
        .hero-card .h-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
        .hero-card .h-body{flex:1}
        .hero-card .h-label{font-size:.6rem;color:var(--text3);margin-bottom:.2rem}
        .hero-card .h-val{font-size:1.8rem;font-weight:700;line-height:1.1}
        .hero-card .h-val .h-unit{font-size:.9rem;font-weight:400;color:var(--text2)}
        .hero-card .h-sub{font-size:.55rem;color:var(--text3);margin-top:.2rem}
        .hero-card .h-spark{position:absolute;bottom:0;right:0;width:45%;height:55%;opacity:.7}
        .h-temp .h-icon{background:rgba(239,68,68,.15);color:var(--red)}
        .h-temp .h-val{color:var(--red)}
        .h-prs .h-icon{background:rgba(56,189,248,.15);color:var(--accent)}
        .h-prs .h-val{color:var(--accent)}
        .h-count .h-icon{background:rgba(167,139,250,.15);color:var(--purple)}
        .h-count .h-val{color:var(--purple)}

        /* Section headers */
        .sec-header{font-size:.75rem;color:var(--text3);margin:1.5rem 0 .75rem;font-weight:500;display:flex;align-items:center;gap:.5rem}

        /* Two column layout */
        .two-col{display:grid;grid-template-columns:auto 1fr;gap:1.5rem;margin-bottom:1.75rem;align-items:start}

        /* Weather sensor cards */
        .wx-grid{display:flex;gap:.75rem;flex-wrap:wrap}
        .wx-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;display:flex;align-items:center;gap:.85rem;position:relative;overflow:hidden;min-width:220px;flex:1}
        .wx-card .wx-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
        .wx-card .wx-body{flex:1}
        .wx-card .wx-name{font-size:.65rem;color:var(--text2);margin-bottom:.1rem}
        .wx-card .wx-val{font-size:1.5rem;font-weight:700;line-height:1.1}
        .wx-card .wx-val .wx-unit{font-size:.75rem;font-weight:400;color:var(--text2)}
        .wx-card .wx-sub{font-size:.55rem;color:var(--text3);margin-top:.15rem}
        .wx-card .wx-range{font-size:.5rem;color:var(--text3);margin-top:.1rem}
        .wx-card .wx-spark{position:absolute;bottom:6px;right:10px;width:35%;height:40%;opacity:.6}
        .wx-prs .wx-icon{background:rgba(56,189,248,.12)}
        .wx-prs .wx-val{color:var(--accent)}
        .wx-temp .wx-icon{background:rgba(249,115,22,.12)}
        .wx-temp .wx-val{color:var(--orange)}
        .wx-hum .wx-icon{background:rgba(56,189,248,.12)}
        .wx-hum .wx-val{color:var(--accent)}

        /* Quick overview stats */
        .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
        .stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;text-align:center}
        .stat-card .st-label{font-size:.6rem;color:var(--text3);margin-bottom:.3rem}
        .stat-card .st-val{font-size:1.4rem;font-weight:700;line-height:1.1}
        .stat-card .st-val .st-unit{font-size:.7rem;font-weight:400;color:var(--text2)}
        .stat-card .st-sub{font-size:.5rem;color:var(--text3);margin-top:.2rem}
        .stat-card.st-avg .st-val{color:var(--orange)}
        .stat-card.st-max .st-val{color:var(--red)}
        .stat-card.st-min .st-val{color:var(--accent)}
        .stat-card.st-prs .st-val{color:var(--purple)}

        /* Charts */
        .charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,450px),1fr));gap:.75rem;margin-bottom:1.75rem}
        .ch-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem}
        .ch-title{font-size:.75rem;font-weight:500;color:var(--text2);margin-bottom:.75rem}
        .ch-wrap{position:relative;height:200px}

        /* System cards */
        .sys-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.75rem;margin-bottom:1rem}
        .sys-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;display:flex;align-items:center;gap:.85rem;position:relative;overflow:hidden}
        .sys-card .sy-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
        .sys-card .sy-body{flex:1}
        .sys-card .sy-name{font-size:.65rem;color:var(--text2)}
        .sys-card .sy-val{font-size:1.4rem;font-weight:700;line-height:1.15;margin-top:.1rem}
        .sys-card .sy-val .sy-unit{font-size:.7rem;font-weight:400;color:var(--text2)}
        .sys-card .sy-sub{font-size:.5rem;color:var(--text3);margin-top:.1rem}
        .sys-card .sy-range{font-size:.5rem;color:var(--text3)}
        .sys-card .sy-spark{position:absolute;bottom:6px;right:10px;width:35%;height:45%;opacity:.6}
        .sy-temp .sy-icon{background:rgba(251,113,133,.12);color:var(--rose)}
        .sy-temp .sy-val{color:var(--rose)}
        .sy-sig .sy-icon{background:rgba(234,179,8,.12);color:var(--yellow)}
        .sy-sig .sy-val{color:var(--yellow)}
        .sy-net .sy-icon{background:rgba(56,189,248,.12);color:var(--accent)}
        .sy-net .sy-val{color:var(--green);font-style:italic;font-size:1rem}

        .footer{text-align:center;padding:2rem 1rem;color:var(--text3);font-size:.7rem;border-top:1px solid var(--border);margin-top:1rem}
        .footer a{color:var(--accent);text-decoration:none}

        .empty-state{text-align:center;padding:5rem 2rem}
        .empty-state h2{font-size:1.1rem;color:var(--text2)}
        .empty-state p{color:var(--text3);font-size:.85rem;margin-top:.5rem}
        .loading-state{text-align:center;padding:5rem 2rem}
        .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1rem}
        @keyframes spin{to{transform:rotate(360deg)}}

        @media(max-width:800px){
            .topbar{padding:1rem;flex-wrap:wrap;gap:.5rem}
            .topbar-center{order:3;width:100%}
            .main{padding:1rem}
            .hero-row{grid-template-columns:1fr}
            .two-col{grid-template-columns:1fr}
            .wx-grid{flex-direction:column}
            .stats-grid{grid-template-columns:repeat(2,1fr)}
            .sys-grid{grid-template-columns:1fr}
            .hero-card .h-val{font-size:1.5rem}
        }
    </style>
</head>
<body>
<div class="topbar">
    <div class="topbar-left"><span class="logo-icon">〰️</span><div><div class="logo-text" data-i18n="title">Sensor Logs</div><div class="logo-sub" data-i18n="subtitle">Realtime sensor monitoring</div></div></div>
    <div class="topbar-center"><div class="topbar-loc" id="location"></div><div class="topbar-time"><span class="dot"></span><span id="last-update"></span></div></div>
    <div class="topbar-right"><button class="lang-btn" id="lang-toggle" onclick="toggleLang()">GR</button><div class="badge-online"><span class="bdot"></span> online</div></div>
</div>
<div class="main" id="dashboard"><div class="loading-state"><div class="spinner"></div><p style="color:var(--text3)" data-i18n="loading">Loading...</p></div></div>
<div class="footer"><strong>Home Sensor Platform</strong> · <a href="/api/docs/">API</a> · <a href="https://github.com/tsaklidis/LogingAPIEnhanced">GitHub</a></div>

<script>
const API='/api/v1';
let lang=localStorage.getItem('lang')||'en';
const I18N={
en:{title:'Sensor Logs',subtitle:'Realtime sensor monitoring',loading:'Loading...',temperature:'Temperature',pressure:'Pressure',sensors:'Sensors',active:'active',weather:'Weather sensors',quickOverview:'Quick overview',avgTemp:'Avg. temperature',maxTemp:'Max temperature',minTemp:'Min temperature',avgPrs:'Avg. pressure',last4h:'last 4 hours',history:'History (last 4 hours)',system:'System & network',signal:'Signal',battery:'Battery',voltage:'Voltage',systemTemp:'Temperature',humidity:'Humidity',lastUpdate:'Last update',noSensors:'No public sensors',noSensorsDesc:'No sensors found in public spaces.',networkStatus:'Network status',connected:'Connected',good:'Good',fair:'Fair',poor:'Poor'},
el:{title:'Sensor Logs',subtitle:'Παρακολούθηση αισθητήρων',loading:'Φόρτωση...',temperature:'Θερμοκρασία',pressure:'Πίεση',sensors:'Αισθητήρες',active:'ενεργοί',weather:'Αισθητήρες καιρού',quickOverview:'Γρήγορη επισκόπηση',avgTemp:'Μέση θερμοκρασία',maxTemp:'Μέγιστη θερμοκρασία',minTemp:'Ελάχιστη θερμοκρασία',avgPrs:'Μέση πίεση',last4h:'τελευταίες 4 ώρες',history:'Ιστορικό (τελευταίες 4 ώρες)',system:'Σύστημα & δίκτυο',signal:'Σήμα',battery:'Μπαταρία',voltage:'Τάση',systemTemp:'Θερμοκρασία',humidity:'Υγρασία',lastUpdate:'Τελευταία ενημέρωση',noSensors:'Δεν υπάρχουν αισθητήρες',noSensorsDesc:'Δεν βρέθηκαν δημόσιοι αισθητήρες.',networkStatus:'Κατάσταση δικτύου',connected:'Συνδεδεμένο',good:'Καλό',fair:'Μέτριο',poor:'Χαμηλό'}
};
function t(k){return I18N[lang][k]||k}
function toggleLang(){lang=lang==='en'?'el':'en';localStorage.setItem('lang',lang);location.reload()}
function applyLang(){document.getElementById('lang-toggle').textContent=lang==='en'?'GR':'EN';document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(I18N[lang][k])el.textContent=I18N[lang][k]})}

const KEYS={temp:['temperature','temp','ds18b20'],hum:['humidity','hum','dht22_h'],prs:['pressure','prs','bmp280','bmp180'],bat:['battery_percentage','battery','bat','battery_lvl'],sig:['signal','wifi','rssi','signal_strength','wifi_signal'],batv:['battery_voltage','batt_voltage','voltage'],sys:['system_temperature','cpu_temp','system']};

async function fetchJSON(u){try{const r=await fetch(u);if(!r.ok)return null;return r.json()}catch{return null}}
function gv(d,keys){for(const k of keys){if(d[k]!==undefined&&d[k]!==null)return parseFloat(d[k])}return null}
function fmt(iso){return new Date(iso).toLocaleTimeString(lang==='el'?'el-GR':'en-GB',{hour:'2-digit',minute:'2-digit'})}
function fmtDT(iso){return new Date(iso).toLocaleString(lang==='el'?'el-GR':'en-GB',{dateStyle:'short',timeStyle:'short'})}

function isSystemSensor(name,data){const n=name.toLowerCase();if(n.includes('system')||n.includes('wifi')||n.includes('signal'))return true;if(n.includes('bmp')&&n.includes('temp'))return true;if(gv(data,KEYS.sys)!==null&&gv(data,KEYS.temp)===null)return true;return false}

// BMP280 reports both temp and pressure - only pressure is weather data
function sensorWeatherData(name,data){
    const n=name.toLowerCase();
    // BMP280 sensor: pressure is weather, temperature is NOT
    if(n.includes('bmp')&&!n.includes('temp')){
        return {prs:gv(data,KEYS.prs), temp:null, hum:null};
    }
    if(isSystemSensor(name,data)) return null;
    return {temp:gv(data,KEYS.temp), hum:gv(data,KEYS.hum), prs:gv(data,KEYS.prs)};
}

function makeChart(canvas,label,data,labels,color){
    if(!canvas||!data.length)return;
    const ctx=canvas.getContext('2d');
    const g=ctx.createLinearGradient(0,0,0,200);g.addColorStop(0,color+'33');g.addColorStop(1,color+'00');
    new Chart(ctx,{type:'line',data:{labels,datasets:[{label,data,borderColor:color,backgroundColor:g,fill:true,tension:.4,pointRadius:0,pointHoverRadius:4,pointHoverBackgroundColor:color,pointHoverBorderColor:'#fff',pointHoverBorderWidth:2,borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{backgroundColor:'#1e293b',titleColor:'#f1f5f9',bodyColor:'#94a3b8',borderColor:'#334155',borderWidth:1,cornerRadius:8,padding:10}},scales:{x:{grid:{color:'rgba(30,45,69,.5)',drawBorder:false},ticks:{color:'#475569',font:{size:9},maxTicksLimit:6,maxRotation:0}},y:{grid:{color:'rgba(30,45,69,.5)',drawBorder:false},ticks:{color:'#475569',font:{size:9},padding:6}}}}});
}

// Mini sparkline (tiny canvas in cards)
function sparkline(canvas,data,color){
    if(!canvas||data.length<2)return;
    const ctx=canvas.getContext('2d');
    new Chart(ctx,{type:'line',data:{labels:data.map((_,i)=>i),datasets:[{data,borderColor:color,borderWidth:1.5,fill:false,tension:.4,pointRadius:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}},animation:false}});
}

async function loadDashboard(){
    const sensors=await fetchJSON(`${API}/public/sensors/`);
    if(!sensors||!sensors.length){document.getElementById('dashboard').innerHTML=`<div class="empty-state"><h2>${t('noSensors')}</h2><p>${t('noSensorsDesc')}</p></div>`;return}

    const loc=sensors[0].home_location;
    if(loc)document.getElementById('location').textContent='📍 '+loc;

    const allData=await Promise.all(sensors.map(async s=>{
        const since=new Date(Date.now()-4*3600000).toISOString();
        const[latest,res]=await Promise.all([fetchJSON(`${API}/public/sensors/${s.id}/readings/latest/`),fetchJSON(`${API}/public/sensors/${s.id}/readings/?recorded_at_after=${since}&page_size=500`)]);
        const readings=(res?(res.results||res):[]).sort((a,b)=>new Date(a.recorded_at)-new Date(b.recorded_at));
        return{...s,latest,readings};
    }));

    let weatherSensors=[],systemSensors=[];
    let heroTemp=null,heroTempRange=null,heroPrs=null,lastUpdate=null;
    let allWeatherTemps=[],allWeatherPrs=[];

    for(const s of allData){
        const d=s.latest?s.latest.data:{};
        const n=s.name.toLowerCase();
        // BMP280 with pressure only → weather; BMP280 with temp → has both, pressure goes to weather, temp to system
        const isSys=isSystemSensor(s.name,d);
        // Put BMP280_Pressure in weather, everything else classified normally
        if(isSys && !(n.includes('bmp')&&n.includes('pressure'))) systemSensors.push(s);
        else weatherSensors.push(s);
        if(s.latest)lastUpdate=s.latest.recorded_at;
        // Hero
        const temp=gv(d,KEYS.temp),prs=gv(d,KEYS.prs);
        if(!isSys || (n.includes('bmp')&&n.includes('pressure'))){
            if(temp!==null&&n.includes('ds18b20')){
                heroTemp=temp;
                const tv=s.readings.map(x=>gv(x.data,KEYS.temp)).filter(v=>v!==null);
                heroTempRange=tv.length?{min:Math.min(...tv),max:Math.max(...tv)}:null;
            }
            if(prs!==null)heroPrs=prs;
            // Collect for stats - only DS18B20 temp for weather stats
            if(n.includes('ds18b20')){
                const tv=s.readings.map(x=>gv(x.data,KEYS.temp)).filter(v=>v!==null);
                if(tv.length)allWeatherTemps.push(...tv);
            }
            const pv=s.readings.map(x=>gv(x.data,KEYS.prs)).filter(v=>v!==null);
            if(pv.length)allWeatherPrs.push(...pv);
        }
    }

    if(lastUpdate)document.getElementById('last-update').textContent=`${t('lastUpdate')}: ${fmtDT(lastUpdate)}`;

    // --- Build HTML ---
    // Hero
    let hero=`<div class="hero-row">`;
    hero+=`<div class="hero-card h-temp"><div class="h-icon">🌡️</div><div class="h-body"><div class="h-label">${t('temperature')} (DS18B20)</div><div class="h-val">${heroTemp!==null?heroTemp.toFixed(1):'--'}<span class="h-unit"> °C</span></div>${heroTempRange?`<div class="h-sub">↓ ${heroTempRange.min.toFixed(1)}° / ↑ ${heroTempRange.max.toFixed(1)}°</div>`:''}</div><canvas class="h-spark" id="spark_hero_temp"></canvas></div>`;
    hero+=`<div class="hero-card h-prs"><div class="h-icon">🔵</div><div class="h-body"><div class="h-label">${t('pressure')}</div><div class="h-val">${heroPrs!==null?Math.round(heroPrs):'--'}<span class="h-unit"> hPa</span></div></div><canvas class="h-spark" id="spark_hero_prs"></canvas></div>`;
    hero+=`<div class="hero-card h-count"><div class="h-icon">📡</div><div class="h-body"><div class="h-label">${t('sensors')}</div><div class="h-val">${allData.length}</div><div class="h-sub">${t('active')}</div></div></div>`;
    hero+=`</div>`;

    // Weather cards + Quick overview
    let wxCards='';
    for(const s of weatherSensors){
        const d=s.latest?s.latest.data:{};
        const wd=sensorWeatherData(s.name,d);
        if(!wd) continue;
        const prs=wd.prs,temp=wd.temp,hum=wd.hum;
        const tv=temp!==null?s.readings.map(x=>gv(x.data,KEYS.temp)).filter(v=>v!==null):[];
        const pv=prs!==null?s.readings.map(x=>gv(x.data,KEYS.prs)).filter(v=>v!==null):[];
        if(prs!==null) wxCards+=`<div class="wx-card wx-prs"><div class="wx-icon">🔵</div><div class="wx-body"><div class="wx-name">${s.name}</div><div class="wx-val">${prs.toFixed(1)}<span class="wx-unit"> hPa</span></div><div class="wx-sub">${t('pressure')}</div>${pv.length?`<div class="wx-range">↓ ${Math.min(...pv).toFixed(1)} / ↑ ${Math.max(...pv).toFixed(1)}</div>`:''}</div><canvas class="wx-spark" id="spark_${s.id.replace(/-/g,'')}_p"></canvas></div>`;
        if(temp!==null) wxCards+=`<div class="wx-card wx-temp"><div class="wx-icon">🌡️</div><div class="wx-body"><div class="wx-name">${s.name}</div><div class="wx-val">${temp.toFixed(1)}<span class="wx-unit"> °C</span></div><div class="wx-sub">${t('temperature')}</div>${tv.length?`<div class="wx-range">↓ ${Math.min(...tv).toFixed(1)}° / ↑ ${Math.max(...tv).toFixed(1)}°</div>`:''}</div><canvas class="wx-spark" id="spark_${s.id.replace(/-/g,'')}_t"></canvas></div>`;
        if(hum!==null){const hv=s.readings.map(x=>gv(x.data,KEYS.hum)).filter(v=>v!==null);wxCards+=`<div class="wx-card wx-hum"><div class="wx-icon">💧</div><div class="wx-body"><div class="wx-name">${s.name}</div><div class="wx-val">${hum.toFixed(1)}<span class="wx-unit"> %</span></div><div class="wx-sub">${t('humidity')}</div></div><canvas class="wx-spark" id="spark_${s.id.replace(/-/g,'')}_h"></canvas></div>`}
    }

    // Quick overview
    let statsHtml='<div class="stats-grid">';
    if(allWeatherTemps.length){
        const avg=(allWeatherTemps.reduce((a,b)=>a+b,0)/allWeatherTemps.length).toFixed(1);
        const max=Math.max(...allWeatherTemps).toFixed(1);
        const min=Math.min(...allWeatherTemps).toFixed(1);
        statsHtml+=`<div class="stat-card st-avg"><div class="st-label">${t('avgTemp')}</div><div class="st-val">${avg}<span class="st-unit"> °C</span></div><div class="st-sub">${t('last4h')}</div></div>`;
        statsHtml+=`<div class="stat-card st-max"><div class="st-label">${t('maxTemp')}</div><div class="st-val">${max}<span class="st-unit"> °C</span></div><div class="st-sub">${t('last4h')}</div></div>`;
        statsHtml+=`<div class="stat-card st-min"><div class="st-label">${t('minTemp')}</div><div class="st-val">${min}<span class="st-unit"> °C</span></div><div class="st-sub">${t('last4h')}</div></div>`;
    }
    if(allWeatherPrs.length){
        const avg=(allWeatherPrs.reduce((a,b)=>a+b,0)/allWeatherPrs.length).toFixed(1);
        statsHtml+=`<div class="stat-card st-prs"><div class="st-label">${t('avgPrs')}</div><div class="st-val">${avg}<span class="st-unit"> hPa</span></div><div class="st-sub">${t('last4h')}</div></div>`;
    }
    statsHtml+=`</div>`;

    // Charts - ONE per sensor (no comparison), only actual weather data
    let chartsHtml='';
    for(const s of weatherSensors){
        const r=s.readings;
        const wd=sensorWeatherData(s.name,s.latest?s.latest.data:{});
        if(!wd) continue;
        const labels=r.map(x=>fmt(x.recorded_at));
        if(wd.temp!==null){const tv=r.map(x=>gv(x.data,KEYS.temp)).filter(v=>v!==null);if(tv.length>2) chartsHtml+=`<div class="ch-card"><div class="ch-title">🌡️ ${s.name} — ${t('temperature')}</div><div class="ch-wrap"><canvas id="ch_${s.id.replace(/-/g,'')}_t"></canvas></div></div>`}
        if(wd.prs!==null){const pv=r.map(x=>gv(x.data,KEYS.prs)).filter(v=>v!==null);if(pv.length>2) chartsHtml+=`<div class="ch-card"><div class="ch-title">🔵 ${s.name} — ${t('pressure')}</div><div class="ch-wrap"><canvas id="ch_${s.id.replace(/-/g,'')}_p"></canvas></div></div>`}
    }

    // System cards
    let sysHtml='';
    for(const s of systemSensors){
        const d=s.latest?s.latest.data:{};
        const sys=gv(d,KEYS.sys),temp=gv(d,KEYS.temp),sig=gv(d,KEYS.sig);
        const n=s.name;
        if(sys!==null){const sv=s.readings.map(x=>gv(x.data,KEYS.sys)).filter(v=>v!==null);sysHtml+=`<div class="sys-card sy-temp"><div class="sy-icon">🌡️</div><div class="sy-body"><div class="sy-name">${n}</div><div class="sy-val">${sys.toFixed(1)}<span class="sy-unit"> °C</span></div><div class="sy-sub">${t('systemTemp')}</div>${sv.length>1?`<div class="sy-range">↓ ${Math.min(...sv).toFixed(1)}° / ↑ ${Math.max(...sv).toFixed(1)}°</div>`:''}</div><canvas class="sy-spark" id="spark_sys_${s.id.replace(/-/g,'')}"></canvas></div>`}
        if(temp!==null&&sys===null){const tv=s.readings.map(x=>gv(x.data,KEYS.temp)).filter(v=>v!==null);sysHtml+=`<div class="sys-card sy-temp"><div class="sy-icon">🌡️</div><div class="sy-body"><div class="sy-name">${n}</div><div class="sy-val">${temp.toFixed(1)}<span class="sy-unit"> °C</span></div><div class="sy-sub">${t('systemTemp')}</div>${tv.length>1?`<div class="sy-range">↓ ${Math.min(...tv).toFixed(1)}° / ↑ ${Math.max(...tv).toFixed(1)}°</div>`:''}</div><canvas class="sy-spark" id="spark_sys_${s.id.replace(/-/g,'')}"></canvas></div>`}
        if(sig!==null){sysHtml+=`<div class="sys-card sy-sig"><div class="sy-icon">📶</div><div class="sy-body"><div class="sy-name">${n}</div><div class="sy-val">${sig.toFixed(1)}<span class="sy-unit"> dBm</span></div><div class="sy-sub">${t('signal')}</div></div><canvas class="sy-spark" id="spark_sig_${s.id.replace(/-/g,'')}"></canvas></div>`}
    }
    // Network status card
    const sigSensor=systemSensors.find(s=>gv(s.latest?.data||{},KEYS.sig)!==null);
    if(sigSensor){
        const sigVal=gv(sigSensor.latest.data,KEYS.sig);
        const quality=sigVal>-50?t('good'):sigVal>-70?t('fair'):t('poor');
        sysHtml+=`<div class="sys-card sy-net"><div class="sy-icon">📡</div><div class="sy-body"><div class="sy-name">${t('networkStatus')}</div><div class="sy-val">${t('connected')}</div><div class="sy-sub">${quality} (${sigVal} dBm)</div></div></div>`;
    }

    document.getElementById('dashboard').innerHTML=`
        ${hero}
        <div class="two-col">
            <div><div class="sec-header">☀️ ${t('weather')}</div><div class="wx-grid">${wxCards}</div></div>
            <div><div class="sec-header">◎ ${t('quickOverview')}</div>${statsHtml}</div>
        </div>
        ${chartsHtml?`<div class="sec-header">📊 ${t('history')}</div><div class="charts-grid">${chartsHtml}</div>`:''}
        ${sysHtml?`<div class="sec-header">🖥️ ${t('system')}</div><div class="sys-grid">${sysHtml}</div>`:''}
    `;

    // Render charts (one per sensor)
    for(const s of weatherSensors){
        const r=s.readings,id=s.id.replace(/-/g,'');
        const wd=sensorWeatherData(s.name,s.latest?s.latest.data:{});
        if(!wd) continue;
        const labels=r.map(x=>fmt(x.recorded_at));
        if(wd.temp!==null){const tv=r.map(x=>gv(x.data,KEYS.temp));if(tv.filter(v=>v!==null).length>2)makeChart(document.getElementById(`ch_${id}_t`),s.name,tv,labels,'#f97316')}
        if(wd.prs!==null){const pv=r.map(x=>gv(x.data,KEYS.prs));if(pv.filter(v=>v!==null).length>2)makeChart(document.getElementById(`ch_${id}_p`),s.name,pv,labels,'#a78bfa')}
        // Sparklines
        if(wd.temp!==null){const tv=r.map(x=>gv(x.data,KEYS.temp)).filter(v=>v!==null);if(tv.length>2)sparkline(document.getElementById(`spark_${id}_t`),tv.slice(-20),'#f97316')}
        if(wd.prs!==null){const pv=r.map(x=>gv(x.data,KEYS.prs)).filter(v=>v!==null);if(pv.length>2)sparkline(document.getElementById(`spark_${id}_p`),pv.slice(-20),'#a78bfa')}
    }
    // Hero sparklines
    const ds18=weatherSensors.find(s=>s.name.toLowerCase().includes('ds18b20'));
    if(ds18){const tv=ds18.readings.map(x=>gv(x.data,KEYS.temp)).filter(v=>v!==null);if(tv.length>2)sparkline(document.getElementById('spark_hero_temp'),tv.slice(-30),'#ef4444')}
    const prsS=weatherSensors.find(s=>gv(s.latest?.data||{},KEYS.prs)!==null);
    if(prsS){const pv=prsS.readings.map(x=>gv(x.data,KEYS.prs)).filter(v=>v!==null);if(pv.length>2)sparkline(document.getElementById('spark_hero_prs'),pv.slice(-30),'#38bdf8')}
    // System sparklines
    for(const s of systemSensors){
        const id=s.id.replace(/-/g,''),r=s.readings;
        const sv=r.map(x=>gv(x.data,KEYS.sys)||gv(x.data,KEYS.temp)).filter(v=>v!==null);
        if(sv.length>2)sparkline(document.getElementById(`spark_sys_${id}`),sv.slice(-20),'#fb7185');
        const sigv=r.map(x=>gv(x.data,KEYS.sig)).filter(v=>v!==null);
        if(sigv.length>2)sparkline(document.getElementById(`spark_sig_${id}`),sigv.slice(-20),'#eab308');
    }
}

applyLang();
loadDashboard();
setInterval(()=>location.reload(),5*60*1000);
</script>
</body>
</html>
