<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Μετρήσεις Αισθητήρων - Home Sensor Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0b1120;
            --bg-card: #151d2e;
            --bg-metric: #1a2438;
            --accent: #38bdf8;
            --green: #34d399;
            --orange: #fb923c;
            --rose: #fb7185;
            --purple: #a78bfa;
            --yellow: #fbbf24;
            --text: #f1f5f9;
            --text2: #94a3b8;
            --text3: #64748b;
            --border: #1e2d45;
            --radius: 14px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

        /* Header */
        .hero {
            padding: 2.5rem 1rem 1.5rem;
            text-align: center;
            background: linear-gradient(180deg, #131b2e 0%, var(--bg) 100%);
        }
        .hero h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.03em; }
        .hero .loc { color: var(--text3); font-size: 0.85rem; margin-top: 0.3rem; }

        /* Top summary strip */
        .summary-strip {
            display: flex;
            gap: 0.75rem;
            overflow-x: auto;
            padding: 0 1rem 1rem;
            max-width: 1200px;
            margin: 0 auto;
            scrollbar-width: none;
        }
        .summary-strip::-webkit-scrollbar { display: none; }
        .summary-item {
            flex: 0 0 auto;
            min-width: 130px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.9rem 1rem;
            text-align: center;
        }
        .summary-item .label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 0.3rem; }
        .summary-item .val { font-size: 1.5rem; font-weight: 700; }
        .summary-item .sub { font-size: 0.6rem; color: var(--text3); margin-top: 0.2rem; }

        /* Main layout */
        .dash { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }

        /* Section titles */
        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text3);
            margin: 1.5rem 0 0.75rem;
            padding-left: 0.25rem;
        }

        /* Metrics grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.75rem;
        }
        .m-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, border-color 0.2s;
        }
        .m-card:hover { transform: translateY(-2px); border-color: var(--accent); }
        .m-card .m-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .m-card .m-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; }
        .m-card .m-sensor { font-size: 0.65rem; color: var(--text3); max-width: 70%; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .m-card .m-val { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
        .m-card .m-unit { font-size: 0.8rem; font-weight: 400; color: var(--text2); }
        .m-card .m-label { font-size: 0.7rem; color: var(--text3); margin-top: 0.15rem; }
        .m-card .m-range { font-size: 0.6rem; color: var(--text3); margin-top: 0.4rem; }
        .m-card .m-bar { position: absolute; top: 0; left: 0; right: 0; height: 2px; }

        /* Color accents */
        .c-temp .m-bar { background: linear-gradient(90deg, #ef4444, var(--orange)); }
        .c-temp .m-val { color: var(--orange); }
        .c-temp .m-icon { background: rgba(249,115,22,0.15); }
        .c-hum .m-bar { background: linear-gradient(90deg, #06b6d4, #3b82f6); }
        .c-hum .m-val { color: var(--accent); }
        .c-hum .m-icon { background: rgba(56,189,248,0.15); }
        .c-prs .m-bar { background: linear-gradient(90deg, #8b5cf6, var(--purple)); }
        .c-prs .m-val { color: var(--purple); }
        .c-prs .m-icon { background: rgba(167,139,250,0.15); }
        .c-bat .m-bar { background: linear-gradient(90deg, #22c55e, #84cc16); }
        .c-bat .m-val { color: var(--green); }
        .c-bat .m-icon { background: rgba(52,211,153,0.15); }
        .c-sig .m-bar { background: linear-gradient(90deg, var(--yellow), var(--orange)); }
        .c-sig .m-val { color: var(--yellow); }
        .c-sig .m-icon { background: rgba(251,191,36,0.15); }
        .c-sys .m-bar { background: linear-gradient(90deg, var(--rose), #e11d48); }
        .c-sys .m-val { color: var(--rose); }
        .c-sys .m-icon { background: rgba(251,113,133,0.15); }

        /* Charts section */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 500px), 1fr));
            gap: 0.75rem;
        }
        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
        }
        .chart-card .ch-title { font-size: 0.8rem; font-weight: 500; color: var(--text2); margin-bottom: 0.75rem; }
        .chart-wrap { position: relative; height: 200px; }

        /* Status bar */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin: 1.5rem 0 0.5rem;
            font-size: 0.7rem;
            color: var(--text3);
        }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* Footer */
        .footer { text-align: center; padding: 2rem 1rem; color: var(--text3); font-size: 0.75rem; border-top: 1px solid var(--border); margin-top: 2rem; }
        .footer a { color: var(--accent); text-decoration: none; }

        /* States */
        .empty-state, .loading-state { text-align: center; padding: 5rem 2rem; }
        .empty-state .icon { font-size: 3rem; opacity: 0.5; }
        .empty-state h2 { font-size: 1.2rem; color: var(--text2); margin-top: 0.5rem; }
        .empty-state p { color: var(--text3); font-size: 0.85rem; }
        .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .hero h1 { font-size: 1.3rem; }
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
            .m-card .m-val { font-size: 1.3rem; }
            .chart-wrap { height: 160px; }
        }
    </style>
</head>
<body>

<div class="hero">
    <h1>🌡️ Μετρήσεις Αισθητήρων</h1>
    <p class="loc" id="location"></p>
</div>

<div id="dashboard">
    <div class="loading-state"><div class="spinner"></div><p style="color:var(--text3)">Φόρτωση...</p></div>
</div>

<div class="footer">
    <strong>Home Sensor Platform</strong> · <a href="/api/docs/">API</a> · <a href="https://github.com/tsaklidis/LogingAPIEnhanced">GitHub</a>
    <br><span style="margin-top:.25rem;display:inline-block">Ανανέωση κάθε 5 λεπτά</span>
</div>

<script>
const API = '/api/v1';
const KEYS = {
    temp: ['temperature','temp','ds18b20'],
    hum:  ['humidity','hum','dht22_h'],
    prs:  ['pressure','prs','bmp280','bmp180'],
    bat:  ['battery_percentage','battery','bat','battery_lvl'],
    sig:  ['signal','wifi','rssi','signal_strength','wifi_signal'],
    batv: ['battery_voltage','batt_voltage','voltage'],
    sys:  ['system_temperature','cpu_temp','system'],
};
const CHART_COLORS = {
    temp: {line:'#f97316', bg:['rgba(249,115,22,.25)','rgba(249,115,22,0)']},
    hum:  {line:'#38bdf8', bg:['rgba(56,189,248,.25)','rgba(56,189,248,0)']},
    prs:  {line:'#a78bfa', bg:['rgba(167,139,250,.25)','rgba(167,139,250,0)']},
    sys:  {line:'#fb7185', bg:['rgba(251,113,133,.25)','rgba(251,113,133,0)']},
};

async function fetchJSON(u){try{const r=await fetch(u);if(!r.ok)return null;return r.json()}catch{return null}}
function gv(d,keys){for(const k of keys){if(d[k]!==undefined&&d[k]!==null)return parseFloat(d[k])}return null}
function fmt(iso){return new Date(iso).toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'})}
function fmtDT(iso){return new Date(iso).toLocaleString('el-GR',{dateStyle:'short',timeStyle:'short'})}

function grad(ctx,c){const g=ctx.createLinearGradient(0,0,0,200);g.addColorStop(0,c.bg[0]);g.addColorStop(1,c.bg[1]);return g}

function makeChart(canvas, datasets){
    if(!canvas) return;
    const ctx=canvas.getContext('2d');
    new Chart(ctx,{
        type:'line',
        data:{labels:datasets[0].labels, datasets:datasets.map(ds=>({
            label:ds.label, data:ds.data,
            borderColor:ds.color.line, backgroundColor:grad(ctx,ds.color),
            fill:true, tension:.4, pointRadius:0, pointHoverRadius:4,
            pointHoverBackgroundColor:ds.color.line, pointHoverBorderColor:'#fff',
            pointHoverBorderWidth:2, borderWidth:2,
        }))},
        options:{
            responsive:true, maintainAspectRatio:false,
            interaction:{mode:'index',intersect:false},
            plugins:{
                legend:{display:datasets.length>1, position:'top', labels:{color:'#94a3b8',boxWidth:10,font:{size:10},padding:8}},
                tooltip:{backgroundColor:'#1e293b',titleColor:'#f1f5f9',bodyColor:'#94a3b8',borderColor:'#334155',borderWidth:1,cornerRadius:8,padding:10,displayColors:true,boxWidth:8}
            },
            scales:{
                x:{grid:{color:'rgba(30,45,69,.6)',drawBorder:false},ticks:{color:'#475569',font:{size:9},maxTicksLimit:6,maxRotation:0}},
                y:{grid:{color:'rgba(30,45,69,.6)',drawBorder:false},ticks:{color:'#475569',font:{size:9},padding:6}}
            }
        }
    });
}

function metricCard(type, icon, label, value, unit, sensorName, min, max) {
    if(value===null) return '';
    const range = (min!==null&&max!==null&&Math.abs(max-min)>0.05)
        ? `<div class="m-range">↓ ${min.toFixed(1)} / ↑ ${max.toFixed(1)}</div>` : '';
    return `<div class="m-card c-${type}">
        <div class="m-bar"></div>
        <div class="m-top"><div class="m-icon">${icon}</div><div class="m-sensor">${sensorName}</div></div>
        <div class="m-val">${typeof value==='number'?value.toFixed(1):value}<span class="m-unit">${unit}</span></div>
        <div class="m-label">${label}</div>
        ${range}
    </div>`;
}

async function loadDashboard(){
    const sensors = await fetchJSON(`${API}/public/sensors/`);
    if(!sensors||!sensors.length){
        document.getElementById('dashboard').innerHTML=`<div class="dash"><div class="empty-state"><div class="icon">📡</div><h2>Δεν υπάρχουν δημόσιοι αισθητήρες</h2><p>Δεν βρέθηκαν αισθητήρες σε δημόσιους χώρους.</p></div></div>`;
        return;
    }

    const loc=sensors[0].home_location;
    if(loc) document.getElementById('location').textContent='📍 '+loc;

    // Fetch all data in parallel
    const allData = await Promise.all(sensors.map(async s=>{
        const since=new Date(Date.now()-4*3600000).toISOString();
        const [latest, readingsRes] = await Promise.all([
            fetchJSON(`${API}/public/sensors/${s.id}/readings/latest/`),
            fetchJSON(`${API}/public/sensors/${s.id}/readings/?recorded_at_after=${since}&page_size=500`)
        ]);
        const readings=(readingsRes?(readingsRes.results||readingsRes):[]).sort((a,b)=>new Date(a.recorded_at)-new Date(b.recorded_at));
        return {...s, latest, readings};
    }));

    // Collect all metrics across sensors
    let metrics=[], chartDatasets={temp:[],hum:[],prs:[],sys:[]};
    let lastUpdate=null;

    for(const s of allData){
        const d = s.latest?s.latest.data:{};
        const r = s.readings;
        const name = s.name;

        // Extract values
        const temp=gv(d,KEYS.temp), hum=gv(d,KEYS.hum), prs=gv(d,KEYS.prs);
        const bat=gv(d,KEYS.bat), sig=gv(d,KEYS.sig), batv=gv(d,KEYS.batv), sys=gv(d,KEYS.sys);

        // Min/max from readings
        const tv=r.map(x=>gv(x.data,KEYS.temp)).filter(v=>v!==null);
        const hv=r.map(x=>gv(x.data,KEYS.hum)).filter(v=>v!==null);
        const pv=r.map(x=>gv(x.data,KEYS.prs)).filter(v=>v!==null);
        const sv=r.map(x=>gv(x.data,KEYS.sys)).filter(v=>v!==null);

        if(temp!==null) metrics.push(metricCard('temp','🌡️','Θερμοκρασία',temp,'°C',name,tv.length?Math.min(...tv):null,tv.length?Math.max(...tv):null));
        if(hum!==null) metrics.push(metricCard('hum','💧','Υγρασία',hum,'%',name,hv.length?Math.min(...hv):null,hv.length?Math.max(...hv):null));
        if(prs!==null) metrics.push(metricCard('prs','🔵','Πίεση',prs,' hPa',name,pv.length?Math.min(...pv):null,pv.length?Math.max(...pv):null));
        if(bat!==null) metrics.push(metricCard('bat','🔋','Μπαταρία',bat,'%',name,null,null));
        if(batv!==null) metrics.push(metricCard('bat','⚡','Τάση',batv,'V',name,null,null));
        if(sig!==null) metrics.push(metricCard('sig','📶','Σήμα',sig,'dBm',name,null,null));
        if(sys!==null) metrics.push(metricCard('sys','🖥️','Σύστημα',sys,'°C',name,sv.length?Math.min(...sv):null,sv.length?Math.max(...sv):null));

        // Collect chart data
        if(tv.length>1){
            const labels=r.map(x=>fmt(x.recorded_at));
            chartDatasets.temp.push({label:name,data:r.map(x=>gv(x.data,KEYS.temp)),labels,color:CHART_COLORS.temp});
        }
        if(hv.length>1){
            const labels=r.map(x=>fmt(x.recorded_at));
            chartDatasets.hum.push({label:name,data:r.map(x=>gv(x.data,KEYS.hum)),labels,color:CHART_COLORS.hum});
        }
        if(pv.length>1){
            const labels=r.map(x=>fmt(x.recorded_at));
            chartDatasets.prs.push({label:name,data:r.map(x=>gv(x.data,KEYS.prs)),labels,color:CHART_COLORS.prs});
        }
        if(sv.length>1){
            const labels=r.map(x=>fmt(x.recorded_at));
            chartDatasets.sys.push({label:name,data:r.map(x=>gv(x.data,KEYS.sys)),labels,color:CHART_COLORS.sys});
        }

        if(s.latest) lastUpdate = s.latest.recorded_at;
    }

    // Build summary strip (pick key values)
    let summaryItems = [];
    const tempSensors = allData.filter(s=>s.latest&&gv(s.latest.data,KEYS.temp)!==null&&!KEYS.sys.some(k=>s.latest.data[k]!==undefined));
    const humSensors = allData.filter(s=>s.latest&&gv(s.latest.data,KEYS.hum)!==null);
    const prsSensors = allData.filter(s=>s.latest&&gv(s.latest.data,KEYS.prs)!==null);

    if(tempSensors.length){
        const vals=tempSensors.map(s=>gv(s.latest.data,KEYS.temp));
        const avg=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
        summaryItems.push(`<div class="summary-item"><div class="label">Μέση θερμ.</div><div class="val" style="color:var(--orange)">${avg}°</div><div class="sub">${vals.length} αισθ.</div></div>`);
    }
    if(humSensors.length){
        const vals=humSensors.map(s=>gv(s.latest.data,KEYS.hum));
        const avg=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(0);
        summaryItems.push(`<div class="summary-item"><div class="label">Μέση υγρασία</div><div class="val" style="color:var(--accent)">${avg}%</div><div class="sub">${vals.length} αισθ.</div></div>`);
    }
    if(prsSensors.length){
        const v=gv(prsSensors[0].latest.data,KEYS.prs);
        summaryItems.push(`<div class="summary-item"><div class="label">Πίεση</div><div class="val" style="color:var(--purple)">${v.toFixed(0)}</div><div class="sub">hPa</div></div>`);
    }
    summaryItems.push(`<div class="summary-item"><div class="label">Αισθητήρες</div><div class="val" style="color:var(--green)">${allData.length}</div><div class="sub">ενεργοί</div></div>`);

    // Build charts HTML
    let chartsHtml = '';
    if(chartDatasets.temp.length) chartsHtml += `<div class="chart-card"><div class="ch-title">🌡️ Θερμοκρασία — 4 ώρες</div><div class="chart-wrap"><canvas id="ch_temp"></canvas></div></div>`;
    if(chartDatasets.hum.length) chartsHtml += `<div class="chart-card"><div class="ch-title">💧 Υγρασία — 4 ώρες</div><div class="chart-wrap"><canvas id="ch_hum"></canvas></div></div>`;
    if(chartDatasets.prs.length) chartsHtml += `<div class="chart-card"><div class="ch-title">🔵 Βαρομετρική πίεση — 4 ώρες</div><div class="chart-wrap"><canvas id="ch_prs"></canvas></div></div>`;
    if(chartDatasets.sys.length) chartsHtml += `<div class="chart-card"><div class="ch-title">🖥️ Θερμοκρασία συστήματος — 4 ώρες</div><div class="chart-wrap"><canvas id="ch_sys"></canvas></div></div>`;

    document.getElementById('dashboard').innerHTML = `
        <div class="summary-strip">${summaryItems.join('')}</div>
        <div class="dash">
            <div class="section-title">Τρέχουσες μετρήσεις</div>
            <div class="metrics-grid">${metrics.join('')}</div>
            ${chartsHtml?`<div class="section-title">Ιστορικό (4 ώρες)</div><div class="charts-grid">${chartsHtml}</div>`:''}
            ${lastUpdate?`<div class="status-bar"><span class="status-dot"></span> Τελευταία ενημέρωση: ${fmtDT(lastUpdate)}</div>`:''}
        </div>
    `;

    // Render charts (multiple sensors per chart)
    if(chartDatasets.temp.length) makeChart(document.getElementById('ch_temp'), chartDatasets.temp);
    if(chartDatasets.hum.length) makeChart(document.getElementById('ch_hum'), chartDatasets.hum);
    if(chartDatasets.prs.length) makeChart(document.getElementById('ch_prs'), chartDatasets.prs);
    if(chartDatasets.sys.length) makeChart(document.getElementById('ch_sys'), chartDatasets.sys);
}

loadDashboard();
setInterval(()=>location.reload(), 5*60*1000);
</script>
</body>
</html>
