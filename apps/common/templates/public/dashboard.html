<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sensor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

        .header { padding: 1.5rem 2rem; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.25rem; font-weight: 700; }
        .header .location { font-size: 0.85rem; color: #94a3b8; }
        .header .status { display: flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; color: #22c55e; }
        .header .status .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }

        .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2.5rem; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem 2rem; }
        .card .label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
        .card .value { font-size: 2.5rem; font-weight: 700; line-height: 1.2; }
        .card .value .unit { font-size: 1rem; font-weight: 400; color: #64748b; }
        .card .meta { font-size: 0.7rem; color: #64748b; margin-top: 0.5rem; }
        .card.temp .value { color: #f97316; }
        .card.pressure .value { color: #38bdf8; }

        .chart-section { margin-bottom: 2rem; }
        .chart-section h2 { font-size: 0.85rem; font-weight: 600; color: #94a3b8; margin-bottom: 1rem; }
        .chart-box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.5rem; }
        .chart-box canvas { width: 100%; height: 250px; }

        .footer { text-align: center; padding: 2rem; font-size: 0.7rem; color: #475569; border-top: 1px solid #1e293b; }
        .footer a { color: #38bdf8; text-decoration: none; }

        .loading { text-align: center; padding: 4rem 2rem; color: #64748b; }
        .error { text-align: center; padding: 4rem 2rem; color: #ef4444; }

        @media (max-width: 600px) {
            .cards { grid-template-columns: 1fr; }
            .container { padding: 1rem; }
            .card .value { font-size: 2rem; }
        }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h1>🌡️ Sensor Dashboard</h1>
        <div class="location" id="location"></div>
    </div>
    <div class="status"><span class="dot"></span> Live</div>
</div>

<div class="container">
    <div id="content">
        <div class="loading">Loading sensor data...</div>
    </div>
</div>

<div class="footer">
    Home Sensor Platform · <a href="/api/docs/">API Docs</a> · <a href="https://github.com/tsaklidis/LogingAPIEnhanced">GitHub</a>
</div>

<script>
const API = '/api/v1';

async function fetchJSON(url) {
    try {
        const res = await fetch(url);
        if (!res.ok) return null;
        return res.json();
    } catch (e) {
        return null;
    }
}

function formatTime(iso) {
    return new Date(iso).toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' });
}

function formatDateTime(iso) {
    return new Date(iso).toLocaleString('el-GR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function getValue(data, keys) {
    for (const k of keys) {
        if (data[k] !== undefined && data[k] !== null) return parseFloat(data[k]);
    }
    return null;
}

const TEMP_KEYS = ['temperature', 'temp', 'ds18b20'];
const PRESSURE_KEYS = ['pressure', 'prs', 'bmp280', 'bmp180'];

async function loadDashboard() {
    const sensors = await fetchJSON(`${API}/public/sensors/`);
    if (!sensors || !sensors.length) {
        document.getElementById('content').innerHTML = '<div class="error">Δεν υπάρχουν διαθέσιμοι δημόσιοι αισθητήρες.</div>';
        return;
    }

    const loc = sensors[0].home_location;
    if (loc) document.getElementById('location').textContent = '📍 ' + loc;

    // Find DS18B20 and BMP280 sensors by name or type
    let tempSensor = null;
    let pressureSensor = null;

    for (const s of sensors) {
        const name = s.name.toLowerCase();
        const type = (s.sensor_type || '').toLowerCase();
        if (!tempSensor && (name.includes('ds18b20') || type.includes('ds18b20'))) tempSensor = s;
        if (!pressureSensor && (name.includes('bmp280') || type.includes('bmp280') || name.includes('pressure'))) pressureSensor = s;
    }

    // Fallback: check latest data for temperature/pressure values
    if (!tempSensor || !pressureSensor) {
        for (const s of sensors) {
            if (tempSensor && pressureSensor) break;
            const latest = await fetchJSON(`${API}/public/sensors/${s.id}/readings/latest/`);
            if (latest && latest.data) {
                if (!tempSensor && getValue(latest.data, TEMP_KEYS) !== null) tempSensor = s;
                if (!pressureSensor && getValue(latest.data, PRESSURE_KEYS) !== null) pressureSensor = s;
            }
        }
    }

    // Fetch latest readings
    const [tempLatest, pressureLatest] = await Promise.all([
        tempSensor ? fetchJSON(`${API}/public/sensors/${tempSensor.id}/readings/latest/`) : null,
        pressureSensor ? fetchJSON(`${API}/public/sensors/${pressureSensor.id}/readings/latest/`) : null,
    ]);

    const tempValue = tempLatest ? getValue(tempLatest.data, TEMP_KEYS) : null;
    const pressureValue = pressureLatest ? getValue(pressureLatest.data, PRESSURE_KEYS) : null;

    // Fetch last 12 hours of readings
    const since = new Date(Date.now() - 12 * 3600000).toISOString();

    const [tempReadings, pressureReadings] = await Promise.all([
        tempSensor ? fetchJSON(`${API}/public/sensors/${tempSensor.id}/readings/?from_date=${since}&limit=1000`) : null,
        pressureSensor ? fetchJSON(`${API}/public/sensors/${pressureSensor.id}/readings/?from_date=${since}&limit=1000`) : null,
    ]);

    const tempData = (tempReadings ? (tempReadings.results || tempReadings) : [])
        .sort((a, b) => new Date(a.recorded_at) - new Date(b.recorded_at));
    const pressureData = (pressureReadings ? (pressureReadings.results || pressureReadings) : [])
        .sort((a, b) => new Date(a.recorded_at) - new Date(b.recorded_at));

    // Build HTML
    let html = '<div class="cards">';
    html += `<div class="card temp">
        <div class="label">Θερμοκρασία (DS18B20)</div>
        <div class="value">${tempValue !== null ? tempValue.toFixed(1) : '--'}<span class="unit"> °C</span></div>
        <div class="meta">${tempLatest ? 'Ενημέρωση: ' + formatDateTime(tempLatest.recorded_at) : 'Χωρίς δεδομένα'}</div>
    </div>`;
    html += `<div class="card pressure">
        <div class="label">Ατμοσφαιρική Πίεση (BMP280)</div>
        <div class="value">${pressureValue !== null ? pressureValue.toFixed(1) : '--'}<span class="unit"> hPa</span></div>
        <div class="meta">${pressureLatest ? 'Ενημέρωση: ' + formatDateTime(pressureLatest.recorded_at) : 'Χωρίς δεδομένα'}</div>
    </div>`;
    html += '</div>';

    html += '<div class="chart-section"><h2>📊 Τελευταίες 12 ώρες</h2>';
    if (tempData.length > 1) {
        html += '<div class="chart-box"><canvas id="tempChart"></canvas></div>';
    }
    if (pressureData.length > 1) {
        html += '<div class="chart-box"><canvas id="pressureChart"></canvas></div>';
    }
    html += '</div>';

    document.getElementById('content').innerHTML = html;

    // Render temperature chart
    if (tempData.length > 1) {
        const ctx = document.getElementById('tempChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: tempData.map(r => formatTime(r.recorded_at)),
                datasets: [{
                    label: 'Θερμοκρασία (°C)',
                    data: tempData.map(r => getValue(r.data, TEMP_KEYS)),
                    borderColor: '#f97316',
                    backgroundColor: 'rgba(249, 115, 22, 0.1)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 0,
                    borderWidth: 2,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', maxTicksLimit: 8, maxRotation: 0 } },
                    y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b' } }
                }
            }
        });
    }

    // Render pressure chart
    if (pressureData.length > 1) {
        const ctx = document.getElementById('pressureChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: pressureData.map(r => formatTime(r.recorded_at)),
                datasets: [{
                    label: 'Πίεση (hPa)',
                    data: pressureData.map(r => getValue(r.data, PRESSURE_KEYS)),
                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56, 189, 248, 0.1)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 0,
                    borderWidth: 2,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', maxTicksLimit: 8, maxRotation: 0 } },
                    y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b' } }
                }
            }
        });
    }
}

loadDashboard();
setInterval(() => location.reload(), 5 * 60 * 1000);
</script>
</body>
</html>
