# docker-compose.override.yml — Development overrides (auto-loaded by docker compose)
services:
  web:
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    volumes:
      - .:/app

  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

